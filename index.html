<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogLoom</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Sortable.js -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background-color: rgba(156, 163, 175, 0.5); border-radius: 20px; }
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 transition-colors duration-300 w-full h-screen overflow-hidden" id="bodyRoot">

    <div id="app" class="w-full h-full relative">
        <div class="flex flex-col items-center justify-center min-h-screen">
            <p class="text-gray-400 font-semibold animate-pulse" id="loadingText">Loading LogLoom...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc, query } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDrP9nAgF-J9ISkPTr0LAC_EeDmDpEWPNw",
            authDomain: "reminder-5f9ca.firebaseapp.com",
            projectId: "reminder-5f9ca",
            storageBucket: "reminder-5f9ca.firebasestorage.app",
            messagingSenderId: "1068531232868",
            appId: "1:1068531232868:web:cf1d7da63f961a391b2f71"
        };

        const appFirebase = initializeApp(firebaseConfig);
        const db = getFirestore(appFirebase);
        const auth = getAuth(appFirebase);

        let currentUser = null;
        let unsubscribeTasks = null;
        let unsubscribeCats = null;

        window.addEventListener('error', function(event) {
            const appEl = document.getElementById('app');
            if (appEl) {
                appEl.innerHTML = `<div class="p-8 h-full bg-white flex flex-col justify-center items-center text-center">
                    <div class="text-red-500 font-bold text-xl mb-4">⚠️ 起動エラーが発生しました</div>
                    <p class="text-gray-600 text-sm mb-4">${event.message}</p>
                    <button onclick="localStorage.clear(); location.reload();" class="bg-blue-500 text-white px-6 py-2 rounded-xl font-bold">データをリセットして再起動</button>
                </div>`;
            }
        });

        const safeStorage = {
            getItem(key) { try { return localStorage.getItem(key); } catch (e) { return null; } },
            setItem(key, value) { try { localStorage.setItem(key, value); } catch (e) { } }
        };

        const availableIcons = [
            'list', 'home', 'heart', 'gem', 'lightbulb', 'gift', 'shopping-cart',
            'briefcase', 'activity', 'star', 'bell', 'coffee', 'book', 'utensils',
            'car', 'dumbbell', 'trophy', 'plane', 'credit-card', 'smile'
        ];
        const availableColors = [
            'bg-red-500', 'bg-orange-500', 'bg-amber-500', 'bg-green-500', 'bg-emerald-500',
            'bg-teal-500', 'bg-blue-500', 'bg-indigo-500', 'bg-purple-500', 'bg-pink-500',
            'bg-gray-500', 'bg-slate-700', 'bg-black'
        ];

        function renderIcon(iconName) {
            const name = iconName || 'list';
            return `<i data-lucide="${name}" class="w-4 h-4"></i>`;
        }

        let tasks = [];
        let categories = [];
        
        let currentView = 'home'; 
        let selectedCategory = null;
        let selectedFilter = 'Today'; 
        let isDarkMode = safeStorage.getItem('smart_theme') === 'dark';
        let isSearchOpen = false;
        let searchQuery = '';
        let isListEditMode = false;

        let localFilterLocation = 'all';
        let localFilterPriority = 'all';
        let localFilterCategory = 'all';
        let localFilterSchedule = 'all';

        let isTaskModalOpen = false;
        let editingTask = null;
        let pendingAiTask = null;
        let customModal = { isOpen: false, type: '', data: null };
        let isSelectCategoryModalOpen = false;
        let viewingImage = null; 
        
        let categoryFormState = { name: '', color: 'bg-blue-500', icon: 'list' };
        let tempMemo = '';
        let taskFormSubtasks = [];
        let taskFormAttachments = [];
        let defaultCategory = '';
        let defaultSchedule = '';

        const appContainer = document.getElementById('app');

        function generateId() { return Math.random().toString(36).substr(2, 9); }
        function formatDate(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
        function getTodayStr() { return formatDate(new Date()); }
        function getThisMonthPrefix() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; }

        function getThisWeekRange() {
            const d = new Date();
            const day = d.getDay();
            const diffToMon = day === 0 ? -6 : 1 - day;
            const mon = new Date(d); mon.setDate(mon.getDate() + diffToMon);
            const sun = new Date(mon); sun.setDate(sun.getDate() + 6);
            return { start: formatDate(mon), end: formatDate(sun) };
        }
        function getWeekendStr() { return getThisWeekRange().end; }
        function getMonthEndStr() {
            const d = new Date();
            const end = new Date(d.getFullYear(), d.getMonth() + 1, 0); 
            return formatDate(end);
        }

        function getNextDueDate(schedule, currentDueDate, detail) {
            const d = new Date();
            const todayStr = formatDate(d);
            const [y, m, day] = currentDueDate.split('-').map(Number);
            let nextD = new Date(y, m - 1, day);

            if (schedule === 'Daily') {
                nextD.setDate(nextD.getDate() + 1);
                while (nextD < d && formatDate(nextD) !== todayStr) { nextD.setDate(nextD.getDate() + 1); }
            } else if (schedule === 'Weekly') {
                nextD.setDate(nextD.getDate() + 7);
                while (nextD < d && formatDate(nextD) !== todayStr) { nextD.setDate(nextD.getDate() + 7); }
            } else if (schedule === 'Monthly') {
                const isLastDay = detail === 'last';
                if (isLastDay) { 
                    nextD = new Date(nextD.getFullYear(), nextD.getMonth() + 2, 0); 
                } else { 
                    nextD.setMonth(nextD.getMonth() + 1); 
                }
                
                while (nextD < d && formatDate(nextD) !== todayStr) {
                    if (isLastDay) { 
                        nextD = new Date(nextD.getFullYear(), nextD.getMonth() + 2, 0); 
                    } else { 
                        nextD.setMonth(nextD.getMonth() + 1); 
                    }
                }
            }
            return formatDate(nextD);
        }

        function getInitialDueDate(schedule, detail) {
            const d = new Date();
            if (schedule === 'Daily') return formatDate(d);
            if (schedule === 'Weekly') {
                const targetDay = (detail === undefined || detail === '') ? 0 : parseInt(detail);
                let diff = targetDay - d.getDay();
                if (diff < 0) diff += 7;
                d.setDate(d.getDate() + diff);
                return formatDate(d);
            }
            if (schedule === 'Monthly') {
                const actualDetail = (detail === undefined || detail === '') ? 'last' : detail;
                let y = d.getFullYear(), m = d.getMonth();
                if (actualDetail === 'last') { return formatDate(new Date(y, m + 1, 0)); }
                else {
                    let tDate = parseInt(actualDetail);
                    let nextD = new Date(y, m, tDate);
                    if (nextD.getMonth() !== m) nextD = new Date(y, m + 1, 0);
                    if (nextD < d && formatDate(nextD) !== formatDate(d)) {
                        nextD = new Date(y, m + 1, tDate);
                        if (nextD.getMonth() !== m + 1) nextD = new Date(y, m + 2, 0);
                    }
                    return formatDate(nextD);
                }
            }
            return formatDate(d);
        }

        function isActiveCompletedTask(t) {
            if (!t.completed) return false;
            if (!['Daily', 'Weekly', 'Monthly'].includes(t.schedule)) return false;
            const today = getTodayStr();
            if (t.dueDate && t.dueDate >= today) return true;
            return false;
        }

        function isTodayTask(t) {
            if (t.completed) return false;
            if (t.schedule === 'Today' || t.schedule === 'Daily') return true;
            const today = getTodayStr();
            if (t.dueDate && t.dueDate <= today) return true;
            return false;
        }
        function isWeekTask(t) {
            if (t.completed) return false;
            if (isTodayTask(t)) return false;
            const today = getTodayStr();
            const { end: weekEnd } = getThisWeekRange();
            if (t.dueDate && t.dueDate > today && t.dueDate <= weekEnd) return true;
            if (!t.dueDate && (t.schedule === 'Week' || t.schedule === 'Weekly')) return true;
            return false;
        }
        function isMonthTask(t) {
            if (t.completed) return false;
            if (isTodayTask(t) || isWeekTask(t)) return false;
            if (t.dueDate && t.dueDate >= getTodayStr()) return true;
            if (t.schedule === 'Month' || t.schedule === 'Monthly') return true;
            return false;
        }

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str).replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        function setupRealtimeSync(uid) {
            if(unsubscribeTasks) unsubscribeTasks();
            if(unsubscribeCats) unsubscribeCats();

            const qTasks = query(collection(db, `users/${uid}/reminders`));
            unsubscribeTasks = onSnapshot(qTasks, (snapshot) => {
                tasks = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                checkAndProcessRecurringTasks();
                render();
            }, (error) => {
                console.error("Firestore Tasks Error:", error);
                if (error.code === 'permission-denied') {
                    alert("【エラー】データベースへのアクセス権限がありません。\nFirebase ConsoleでFirestoreのセキュリティルールを更新してください。");
                } else {
                    alert("タスクの同期中にエラーが発生しました:\n" + error.message);
                }
            });

            const qCats = query(collection(db, `users/${uid}/categories`));
            unsubscribeCats = onSnapshot(qCats, (snapshot) => {
                categories = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));

                // カテゴリが0件の場合はデフォルトを自動セット
                if (categories.length === 0) {
                    const defaultCats = [
                        { id: generateId(), name: 'To Do', icon: 'list', color: 'bg-blue-500' },
                        { id: generateId(), name: '買い物', icon: 'shopping-cart', color: 'bg-orange-500' },
                        { id: generateId(), name: '仕事', icon: 'briefcase', color: 'bg-indigo-500' },
                        { id: generateId(), name: 'アイデア', icon: 'lightbulb', color: 'bg-amber-500' }
                    ];
                    defaultCats.forEach(cat => saveCategoryToFirestore(cat));
                    categories = defaultCats;
                }
                render();
            }, (error) => {
                console.error("Firestore Cats Error:", error);
            });
        }

        async function saveTaskToFirestore(task) {
            if (!currentUser) return;
            try {
                await setDoc(doc(db, `users/${currentUser.uid}/reminders`, task.id), task);
            } catch (error) {
                console.error("Error saving task:", error);
            }
        }
        async function deleteTaskFromFirestore(taskId) {
            if (!currentUser) return;
            try {
                await deleteDoc(doc(db, `users/${currentUser.uid}/reminders`, taskId));
            } catch (error) {
                console.error("Error deleting task:", error);
            }
        }
        async function saveCategoryToFirestore(category) {
            if (!currentUser) return;
            try {
                await setDoc(doc(db, `users/${currentUser.uid}/categories`, category.id), category);
            } catch (error) {
                console.error("Error saving category:", error);
            }
        }
        async function deleteCategoryFromFirestore(catId) {
            if (!currentUser) return;
            try {
                await deleteDoc(doc(db, `users/${currentUser.uid}/categories`, catId));
            } catch (error) {
                console.error("Error deleting category:", error);
            }
        }

        function checkAndProcessRecurringTasks() {
            const today = getTodayStr();
            let hasUpdates = false;

            tasks.forEach(t => {
                if (t.dueDate && t.dueDate < today && ['Daily', 'Weekly', 'Monthly'].includes(t.schedule)) {
                    if (!t.completed) {
                        const nextDate = getNextDueDate(t.schedule, t.dueDate, t.recurringDetail);
                        t.schedule = t.schedule + '_Expired';
                        saveTaskToFirestore(t);
                        const newTask = { ...t, id: generateId(), dueDate: nextDate, schedule: t.schedule.replace('_Expired', ''), createdAt: Date.now() };
                        saveTaskToFirestore(newTask);
                        hasUpdates = true;
                    } else {
                        t.schedule = t.schedule + '_Expired';
                        saveTaskToFirestore(t);
                        hasUpdates = true;
                    }
                }
            });
            if(hasUpdates) render();
        }

        window.loginWithGoogle = async () => {
            try {
                const provider = new GoogleAuthProvider();
                provider.setCustomParameters({ prompt: 'select_account' });
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error("Login Error:", error);
                let errorMessage = "ログインに失敗しました。";
                if (error.code === 'auth/popup-blocked') {
                    errorMessage = "ブラウザのポップアップブロックが原因で画面が開けません。設定で許可してください。";
                } else if (error.code === 'auth/unauthorized-domain') {
                    errorMessage = "このドメイン(URL)はFirebaseで許可されていません。Firebase Consoleの「承認済みドメイン」に追加してください。";
                } else if (error.code === 'auth/popup-closed-by-user') {
                    errorMessage = "ログイン処理がキャンセルされました。";
                } else if (error.code === 'auth/cancelled-popup-request') {
                    errorMessage = "ログイン処理が重複してリクエストされました。画面を再読み込み後、一度だけクリックしてください。";
                }
                alert(errorMessage + "\n(エラーコード: " + error.code + ")");
            }
        };

        window.logout = async () => {
            try { await signOut(auth); } 
            catch (error) { console.error("Logout Error:", error); }
        };

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                setupRealtimeSync(user.uid);
            } else {
                if(unsubscribeTasks) { unsubscribeTasks(); unsubscribeTasks = null; }
                if(unsubscribeCats) { unsubscribeCats(); unsubscribeCats = null; }
                tasks = [];
                categories = [];
                render();
            }
        });

        function getCounts() {
            const activeTasks = tasks.filter(t => !t.completed);
            return {
                Today: activeTasks.filter(t => isTodayTask(t)).length,
                Week: activeTasks.filter(t => isWeekTask(t)).length,
                Month: activeTasks.filter(t => isMonthTask(t)).length,
                Daily: tasks.filter(t => t.schedule === 'Daily' && (!t.completed || isActiveCompletedTask(t))).length,
                Weekly: tasks.filter(t => t.schedule === 'Weekly' && (!t.completed || isActiveCompletedTask(t))).length,
                Monthly: tasks.filter(t => t.schedule === 'Monthly' && (!t.completed || isActiveCompletedTask(t))).length,
                Undated: activeTasks.filter(t => !t.schedule || t.schedule === '').length,
                Executed: tasks.filter(t => t.completed).length
            };
        }

        window.toggleListEditMode = () => {
            isListEditMode = !isListEditMode;
            render();
        };

        window.navigate = (view) => { 
            currentView = view; 
            if (view === 'home') isListEditMode = false; 
            render(); 
        };

        window.insertTaskAtProperPosition = (task) => {
            saveTaskToFirestore(task);
        };

        function render() {
            try {
                const root = document.getElementById('bodyRoot');
                if (isDarkMode) { root.classList.add('dark', 'bg-gray-950'); root.classList.remove('bg-gray-100'); }
                else { root.classList.remove('dark', 'bg-gray-950'); root.classList.add('bg-gray-100'); }

                const showSidebarOnMobile = currentView === 'home';
                let mainTitle = 'タスク一覧';
                if (currentView === 'settings') mainTitle = '設定';
                else if (selectedCategory) mainTitle = selectedCategory;
                else if (selectedFilter) mainTitle = selectedFilter;

                let html = `
                    <div class="flex h-screen w-full mx-auto max-w-7xl overflow-hidden bg-gray-50 dark:bg-gray-900 transition-colors duration-300 relative">
                        <aside class="w-full sm:w-[320px] md:w-[380px] flex-shrink-0 flex flex-col h-full border-r border-gray-200 dark:border-gray-800 transition-transform overflow-hidden ${showSidebarOnMobile ? 'flex' : 'hidden sm:flex'}">
                            <header class="px-5 py-4 flex items-center justify-between border-b border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 z-20 flex-shrink-0">
                                <h1 class="text-xl font-bold tracking-tight text-gray-900 dark:text-white">LogLoom</h1>
                                <div class="flex items-center gap-1">
                                    <button onclick="window.toggleDarkMode()" class="p-2 rounded-full text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-800 transition">
                                        <i data-lucide="${isDarkMode ? 'sun' : 'moon'}" class="w-5 h-5"></i>
                                    </button>
                                    <button onclick="window.openSettings()" class="p-2 rounded-full text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-800 transition">
                                        <i data-lucide="settings" class="w-5 h-5"></i>
                                    </button>
                                </div>
                            </header>
                            <div class="flex-1 overflow-y-auto p-4 space-y-6 pb-48">
                                ${currentUser ? renderHomeContent() : renderLoginPrompt()}
                            </div>
                        </aside>

                        <main class="flex-1 min-w-0 flex flex-col h-full relative overflow-hidden ${!showSidebarOnMobile ? 'flex' : 'hidden sm:flex'}">
                            <header class="px-5 py-4 flex items-center justify-between border-b border-gray-200 dark:border-gray-800 bg-white/80 dark:bg-gray-900/80 backdrop-blur z-20 flex-shrink-0">
                                <div class="flex items-center gap-2 overflow-hidden">
                                    <button onclick="window.navigate('home')" class="sm:hidden p-1.5 -ml-2 rounded-full text-blue-500 hover:bg-blue-50 dark:hover:bg-gray-800 transition flex items-center flex-shrink-0">
                                        <i data-lucide="chevron-left" class="w-6 h-6"></i><span class="font-semibold text-base">戻る</span>
                                    </button>
                                    <h2 class="text-2xl font-bold tracking-tight text-gray-900 dark:text-white truncate ${currentView !== 'home' ? '' : 'hidden sm:block'}">${escapeHtml(mainTitle)}</h2>
                                </div>
                                <div class="flex items-center gap-2 flex-shrink-0">
                                    <button onclick="window.toggleSearch()" class="p-2 rounded-full text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-800 transition ${currentView === 'settings' ? 'hidden' : ''}">
                                        <i data-lucide="search" class="w-5 h-5"></i>
                                    </button>
                                </div>
                            </header>
                            <div class="flex-1 overflow-y-auto overflow-x-hidden p-5 sm:px-8 lg:px-12 pb-56">
                                ${currentView === 'settings' ? renderSettings() : (currentUser ? renderTaskList() : '')}
                            </div>
                        </main>

                        ${currentUser ? `
                        <button onclick="window.openTaskModal()" class="fixed bottom-8 right-6 sm:bottom-10 sm:right-10 z-40 w-16 h-16 bg-blue-500 hover:bg-blue-600 text-white rounded-full flex items-center justify-center shadow-2xl transition transform hover:scale-105 active:scale-95 ${currentView === 'settings' ? 'hidden' : ''}">
                            <i data-lucide="plus" class="w-8 h-8"></i>
                        </button>` : ''}
                    </div>

                    ${isTaskModalOpen ? renderTaskModal() : ''}
                    ${pendingAiTask && !isSelectCategoryModalOpen ? renderAiConfirmModal() : ''}
                    ${customModal.isOpen ? renderCustomModal() : ''}
                    ${isSelectCategoryModalOpen ? renderSelectCategoryModal() : ''}
                    ${viewingImage ? renderImageViewer() : ''}
                `;
                appContainer.innerHTML = html;
                
                if (typeof lucide !== 'undefined') lucide.createIcons();
                else setTimeout(() => { if (typeof lucide !== 'undefined') lucide.createIcons(); }, 150);
            } catch (err) {
                console.error("Render Error:", err);
            }
        }

        function renderLoginPrompt() {
            return `
                <div class="flex flex-col items-center justify-center py-20 text-center space-y-4">
                    <div class="w-20 h-20 bg-blue-100 dark:bg-blue-900/30 text-blue-500 rounded-full flex items-center justify-center mb-2">
                        <i data-lucide="cloud" class="w-10 h-10"></i>
                    </div>
                    <h3 class="font-bold text-lg text-gray-900 dark:text-white">クラウド同期</h3>
                    <p class="text-sm text-gray-500 dark:text-gray-400">Googleアカウントでログインすると、<br>他端末とリアルタイムに同期できます。</p>
                    <button onclick="window.loginWithGoogle()" class="mt-4 bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-6 rounded-xl flex items-center gap-2 transition shadow-md">
                        <i data-lucide="log-in" class="w-5 h-5"></i> Googleでログイン
                    </button>
                </div>
            `;
        }

        function renderHomeContent() {
            const counts = getCounts();
            return `
                <div class="space-y-3">
                    <div class="grid grid-cols-3 gap-2">
                        <div onclick="window.selectFilter('Today')" class="bg-blue-500 text-white p-3 rounded-2xl flex flex-col justify-between cursor-pointer shadow-sm hover:opacity-90 transition min-h-[5.5rem] ${selectedFilter === 'Today' && !selectedCategory ? 'ring-2 ring-blue-300' : ''}">
                            <div class="flex justify-between items-start"><i data-lucide="calendar" class="w-5 h-5 opacity-80"></i><span class="text-xl font-bold leading-none">${counts.Today}</span></div>
                            <span class="text-xs font-semibold mt-1">Today</span>
                        </div>
                        <div onclick="window.selectFilter('Week')" class="bg-indigo-500 text-white p-3 rounded-2xl flex flex-col justify-between cursor-pointer shadow-sm hover:opacity-90 transition min-h-[5.5rem] ${selectedFilter === 'Week' && !selectedCategory ? 'ring-2 ring-indigo-300' : ''}">
                            <div class="flex justify-between items-start"><i data-lucide="calendar-days" class="w-5 h-5 opacity-80"></i><span class="text-xl font-bold leading-none">${counts.Week}</span></div>
                            <span class="text-xs font-semibold mt-1">Week</span>
                        </div>
                        <div onclick="window.selectFilter('Month')" class="bg-purple-500 text-white p-3 rounded-2xl flex flex-col justify-between cursor-pointer shadow-sm hover:opacity-90 transition min-h-[5.5rem] ${selectedFilter === 'Month' && !selectedCategory ? 'ring-2 ring-purple-300' : ''}">
                            <div class="flex justify-between items-start"><i data-lucide="calendar-range" class="w-5 h-5 opacity-80"></i><span class="text-xl font-bold leading-none">${counts.Month}</span></div>
                            <span class="text-xs font-semibold mt-1">Month</span>
                        </div>
                    </div>
                    <div class="grid grid-cols-3 gap-2">
                        <div onclick="window.selectFilter('Daily')" class="bg-emerald-500 text-white p-3 rounded-2xl flex flex-col justify-between cursor-pointer shadow-sm hover:opacity-90 transition min-h-[5.5rem] ${selectedFilter === 'Daily' && !selectedCategory ? 'ring-2 ring-emerald-300' : ''}">
                            <div class="flex justify-between items-start"><i data-lucide="repeat" class="w-5 h-5 opacity-80"></i><span class="text-xl font-bold leading-none">${counts.Daily}</span></div>
                            <span class="text-xs font-semibold mt-1">Daily</span>
                        </div>
                        <div onclick="window.selectFilter('Weekly')" class="bg-teal-500 text-white p-3 rounded-2xl flex flex-col justify-between cursor-pointer shadow-sm hover:opacity-90 transition min-h-[5.5rem] ${selectedFilter === 'Weekly' && !selectedCategory ? 'ring-2 ring-teal-300' : ''}">
                            <div class="flex justify-between items-start"><i data-lucide="repeat" class="w-5 h-5 opacity-80"></i><span class="text-xl font-bold leading-none">${counts.Weekly}</span></div>
                            <span class="text-xs font-semibold mt-1">Weekly</span>
                        </div>
                        <div onclick="window.selectFilter('Monthly')" class="bg-cyan-500 text-white p-3 rounded-2xl flex flex-col justify-between cursor-pointer shadow-sm hover:opacity-90 transition min-h-[5.5rem] ${selectedFilter === 'Monthly' && !selectedCategory ? 'ring-2 ring-cyan-300' : ''}">
                            <div class="flex justify-between items-start"><i data-lucide="repeat" class="w-5 h-5 opacity-80"></i><span class="text-xl font-bold leading-none">${counts.Monthly}</span></div>
                            <span class="text-xs font-semibold mt-1">Monthly</span>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div onclick="window.selectFilter('Undated')" class="bg-slate-500 text-white p-3 rounded-2xl flex flex-col justify-between cursor-pointer shadow-sm hover:opacity-90 transition min-h-[5rem] ${selectedFilter === 'Undated' && !selectedCategory ? 'ring-2 ring-slate-400' : ''}">
                            <div class="flex justify-between items-start"><i data-lucide="help-circle" class="w-5 h-5 opacity-80"></i><span class="text-xl font-bold leading-none">${counts.Undated}</span></div>
                            <span class="text-xs font-semibold mt-1">Undated</span>
                        </div>
                        <div onclick="window.selectFilter('Executed')" class="bg-gray-700 text-white p-3 rounded-2xl flex flex-col justify-between cursor-pointer shadow-sm hover:opacity-90 transition min-h-[5rem] ${selectedFilter === 'Executed' && !selectedCategory ? 'ring-2 ring-gray-400' : ''}">
                            <div class="flex justify-between items-start"><i data-lucide="check-circle-2" class="w-5 h-5 opacity-80"></i><span class="text-xl font-bold leading-none">${counts.Executed}</span></div>
                            <span class="text-xs font-semibold mt-1">Executed</span>
                        </div>
                    </div>
                </div>

                <div class="mt-8 mb-2 flex items-center justify-between">
                    <h2 class="text-lg font-bold text-gray-800 dark:text-gray-200">マイリスト</h2>
                    <button onclick="window.toggleListEditMode()" class="text-sm font-semibold flex items-center gap-1 ${isListEditMode ? 'text-blue-500 bg-blue-50 dark:bg-blue-900/40' : 'text-gray-500 hover:bg-gray-200 dark:hover:bg-gray-800'} px-3 py-1.5 rounded-full transition cursor-pointer">
                        ${isListEditMode ? '完了' : '編集'}
                    </button>
                </div>

                <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm overflow-hidden mb-8 flex flex-col">
                    <div id="categoryListContainer" class="divide-y divide-gray-100 dark:divide-gray-700">
                        ${categories.map(cat => {
                            const count = tasks.filter(t => t.category === cat.name && (!t.completed || isActiveCompletedTask(t))).length;
                            const isSelected = selectedCategory === cat.name;
                            return `
                                <div ${!isListEditMode ? `onclick="window.selectCategory('${escapeHtml(cat.name)}')" ` : ''} class="flex items-center justify-between p-4 ${!isListEditMode ? 'cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-700' : ''} ${isSelected ? 'bg-blue-50 dark:bg-blue-900/20' : ''} transition">
                                    <div class="flex items-center gap-3">
                                        <div class="w-8 h-8 rounded-full ${escapeHtml(cat.color || 'bg-blue-500')} flex items-center justify-center text-white text-sm shadow-sm">${renderIcon(cat.icon)}</div>
                                        <span class="font-medium ${isSelected ? 'text-blue-600 font-bold' : ''}">${escapeHtml(cat.name)}</span>
                                    </div>
                                    <div class="flex items-center gap-2">
                                        ${!isListEditMode ? `<span class="text-sm text-gray-400 font-semibold">${count}</span><i data-lucide="chevron-right" class="w-4 h-4 text-gray-400"></i>` 
                                        : `<button onclick="window.openCustomModal('editList', { id: '${cat.id}' })" class="p-1.5 text-gray-400 hover:text-blue-500"><i data-lucide="pencil" class="w-4 h-4"></i></button>
                                           <button onclick="window.openCustomModal('deleteList', { id: '${cat.id}', name: '${escapeHtml(cat.name)}' })" class="p-1.5 text-gray-400 hover:text-red-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button>`}
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                    ${isListEditMode ? `
                        <div onclick="window.openCustomModal('addList')" class="flex items-center gap-3 p-4 hover:bg-gray-50 dark:hover:bg-gray-700 cursor-pointer text-blue-500 font-medium border-t border-gray-100 dark:border-gray-700 transition">
                            <div class="w-8 h-8 rounded-full bg-blue-50 dark:bg-blue-900/30 flex items-center justify-center border border-dashed border-blue-300">
                                <i data-lucide="plus" class="w-5 h-5"></i>
                            </div>
                            新しいリストを作成
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function renderTaskList() {
            let filteredTasks = tasks.filter(t => {
                if (selectedFilter === 'Executed' && !selectedCategory) { return t.completed; }
                if (selectedCategory) {
                    if (t.category !== selectedCategory) return false;
                    if (t.completed && !isActiveCompletedTask(t)) return false; 
                }
                if (!selectedCategory && selectedFilter && selectedFilter !== 'Executed') {
                    if (t.completed) {
                        if (['Daily', 'Weekly', 'Monthly'].includes(selectedFilter)) {
                            if (!isActiveCompletedTask(t)) return false;
                        } else { return false; }
                    }
                    let match = false;
                    if (selectedFilter === 'Today') match = isTodayTask(t);
                    else if (selectedFilter === 'Week') match = isWeekTask(t);
                    else if (selectedFilter === 'Month') match = isMonthTask(t);
                    else if (selectedFilter === 'Daily') match = t.schedule === 'Daily';
                    else if (selectedFilter === 'Weekly') match = t.schedule === 'Weekly';
                    else if (selectedFilter === 'Monthly') match = t.schedule === 'Monthly';
                    else if (selectedFilter === 'Undated') match = !t.schedule || t.schedule === '';
                    if (!match) return false;
                }
                return true;
            });

            const active = filteredTasks.filter(t => !t.completed);
            const completed = filteredTasks.filter(t => t.completed);
            filteredTasks = [...active, ...completed];

            if (filteredTasks.length === 0) return `<div class="flex flex-col items-center justify-center py-32 text-gray-400"><i data-lucide="check-circle" class="w-16 h-16 mb-4 opacity-30"></i><p>タスクはありません</p></div>`;

            return `<div class="space-y-3" id="taskListContainer">
                ${filteredTasks.map(task => {
                    const isComp = task.completed;
                    let displaySch = escapeHtml((task.schedule || '').replace('_Expired', ''));
                    if (task.schedule === 'Weekly' || task.schedule === 'Weekly_Expired') {
                        if (task.recurringDetail !== undefined && task.recurringDetail !== '') {
                            const days = ['日', '月', '火', '水', '木', '金', '土'];
                            displaySch = `毎週${days[parseInt(task.recurringDetail)]}曜`;
                        }
                    } else if (task.schedule === 'Monthly' || task.schedule === 'Monthly_Expired') {
                        if (task.recurringDetail !== undefined && task.recurringDetail !== '') {
                            displaySch = task.recurringDetail === 'last' ? '毎月末' : `毎月${task.recurringDetail}日`;
                        }
                    }

                    return `
                    <div class="bg-white dark:bg-gray-800 p-4 sm:p-5 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 flex items-start justify-between gap-4 transition group ${isComp ? 'opacity-70 bg-gray-50 dark:bg-gray-800/50' : ''}">
                        <div class="flex items-start gap-3 flex-1 min-w-0">
                            <input type="checkbox" ${isComp ? 'checked' : ''} onchange="window.toggleTaskComplete('${task.id}')" class="mt-1 w-6 h-6 rounded-full border-gray-300 text-blue-600 focus:ring-blue-500 cursor-pointer">
                            <div class="flex-1 min-w-0">
                                <p class="font-medium text-base ${isComp ? 'line-through text-gray-400' : ''}">${escapeHtml(task.title)}</p>
                                ${task.memo ? `<div class="mt-2 text-sm text-gray-600 dark:text-gray-300 bg-gray-50 dark:bg-gray-900/50 p-3 rounded-xl">${escapeHtml(task.memo).replace(/\n/g, '<br>')}</div>` : ''}
                                <div class="flex flex-wrap items-center gap-2 mt-3 text-xs text-gray-500">
                                    ${task.category ? `<span class="bg-gray-100 dark:bg-gray-700 px-2.5 py-1 rounded-md">${escapeHtml(task.category)}</span>` : ''}
                                    ${displaySch ? `<span class="bg-blue-50 text-blue-600 dark:bg-blue-900/30 px-2.5 py-1 rounded-md">${displaySch}</span>` : ''}
                                    ${task.dueDate ? `<span class="${!isComp && task.dueDate < getTodayStr() ? 'text-red-500' : ''}">${escapeHtml(task.dueDate)}</span>` : ''}
                                </div>
                            </div>
                        </div>
                        <div class="flex flex-col gap-2">
                            <button onclick="window.editTask('${task.id}')" class="p-2 text-gray-400 hover:text-blue-500"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                            <button onclick="window.openCustomModal('deleteTask', { id: '${task.id}' })" class="p-2 text-gray-400 hover:text-red-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>
                    </div>`;
                }).join('')}
            </div>`;
        }

        function renderSettings() {
            return `
                <div class="max-w-2xl w-full mx-auto space-y-6">
                    <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800 space-y-6">
                        <h3 class="font-bold text-lg border-b border-gray-100 dark:border-gray-700 pb-3 text-gray-900 dark:text-white">アカウント設定</h3>
                        ${currentUser ? `
                            <div class="flex items-center gap-4 p-4 bg-blue-50 dark:bg-blue-900/20 rounded-xl">
                                <img src="${currentUser.photoURL || ''}" class="w-12 h-12 rounded-full bg-blue-200">
                                <div>
                                    <p class="font-bold text-gray-900 dark:text-white">${escapeHtml(currentUser.displayName || 'ユーザー')}</p>
                                    <p class="text-sm text-gray-500">${escapeHtml(currentUser.email || '')}</p>
                                </div>
                            </div>
                            <button onclick="window.logout()" class="w-full bg-gray-100 hover:bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-white font-bold p-3 rounded-xl transition">ログアウト</button>
                        ` : `
                            <p class="text-sm text-gray-500">現在ログインしていません。</p>
                            <button onclick="window.loginWithGoogle()" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold p-3 rounded-xl flex items-center justify-center gap-2 transition">
                                <i data-lucide="log-in" class="w-5 h-5"></i> Googleでログイン
                            </button>
                        `}
                    </div>
                </div>
            `;
        }

        function renderCustomModal() {
            if (customModal.type === 'addList' || customModal.type === 'editList') return renderCategoryModal();
            let title = '', content = '', actionBtn = '';
            if (customModal.type === 'deleteList') {
                title = 'リストの削除';
                content = `<p class="text-sm text-gray-600 dark:text-gray-300">リスト「${escapeHtml(customModal.data.name)}」を削除しますか？<br><span class="text-xs text-red-500">※リスト内のタスクは消えません（カテゴリ未設定になります）</span></p>`;
                actionBtn = `<button onclick="window.handleModalSubmit()" class="flex-1 bg-red-500 text-white font-semibold p-3 rounded-xl">削除する</button>`;
            } else if (customModal.type === 'deleteTask') {
                title = 'タスクの削除';
                content = `<p class="text-sm text-gray-600 dark:text-gray-300">このタスクを完全に削除しますか？</p>`;
                actionBtn = `<button onclick="window.handleModalSubmit()" class="flex-1 bg-red-500 text-white font-semibold p-3 rounded-xl">削除する</button>`;
            }
            return `<div class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
                <div class="bg-white dark:bg-gray-900 w-full max-w-sm rounded-2xl p-6 shadow-2xl">
                    <h3 class="font-bold text-lg text-gray-900 dark:text-white">${title}</h3>
                    ${content}
                    <div class="flex gap-2 mt-6">
                        <button onclick="window.closeCustomModal()" class="flex-1 bg-gray-200 dark:bg-gray-700 font-semibold p-3 rounded-xl text-gray-800 dark:text-gray-200">キャンセル</button>
                        ${actionBtn}
                    </div>
                </div></div>`;
        }

        function renderCategoryModal() {
            return `<div class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
                <div class="bg-white dark:bg-gray-900 w-full max-w-md rounded-2xl shadow-2xl p-6 space-y-4">
                    <div class="flex justify-center mb-2">
                        <div class="w-14 h-14 rounded-full ${categoryFormState.color} text-white flex items-center justify-center text-xl shadow-md">
                            ${renderIcon(categoryFormState.icon)}
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">カテゴリ名</label>
                        <input type="text" value="${escapeHtml(categoryFormState.name)}" oninput="categoryFormState.name = this.value" placeholder="リスト名" class="w-full bg-transparent border-b-2 border-gray-300 dark:border-gray-700 p-2 outline-none text-lg font-bold text-gray-900 dark:text-white">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-2">カラー</label>
                        <div class="flex flex-wrap gap-2">
                            ${availableColors.map(c => `
                                <button onclick="categoryFormState.color='${c}'; render();" class="w-7 h-7 rounded-full ${c} ${categoryFormState.color===c?'ring-2 ring-offset-2 ring-gray-400':''}"></button>
                            `).join('')}
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-2">アイコン</label>
                        <div class="grid grid-cols-6 gap-2 max-h-36 overflow-y-auto">
                            ${availableIcons.map(ic => `
                                <button onclick="categoryFormState.icon='${ic}'; render();" class="p-2 rounded-lg ${categoryFormState.icon===ic?'bg-gray-200 dark:bg-gray-700 text-blue-500':'text-gray-500'} flex items-center justify-center">
                                    <i data-lucide="${ic}" class="w-5 h-5"></i>
                                </button>
                            `).join('')}
                        </div>
                    </div>
                    <div class="flex gap-2 pt-4">
                        <button onclick="window.closeCustomModal()" class="flex-1 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 p-3 rounded-xl font-bold">キャンセル</button>
                        <button onclick="window.handleModalSubmit()" class="flex-1 bg-blue-500 text-white p-3 rounded-xl font-bold">保存</button>
                    </div>
                </div></div>`;
        }

        function renderTaskModal() {
            const isCustom = editingTask && editingTask.schedule === 'Custom';
            const displaySchedule = editingTask ? (editingTask.schedule || '').replace('_Expired', '') : defaultSchedule;
            return `<div class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-end sm:items-center justify-center sm:p-4">
                <div class="bg-white dark:bg-gray-900 w-full sm:max-w-lg rounded-t-3xl sm:rounded-2xl shadow-2xl flex flex-col max-h-[90vh]">
                    <div class="flex justify-between p-4 border-b border-gray-100 dark:border-gray-800">
                        <button onclick="window.closeTaskModal()" class="p-2 text-gray-500"><i data-lucide="x" class="w-6 h-6"></i></button>
                        <h3 class="font-bold text-lg text-gray-900 dark:text-white">${editingTask ? '編集' : '新規タスク'}</h3>
                        <button onclick="document.getElementById('taskFormSubmitBtn').click()" class="p-2 text-blue-500"><i data-lucide="check" class="w-6 h-6"></i></button>
                    </div>
                    <form id="taskForm" onsubmit="window.handleTaskSubmit(event)" class="flex-1 overflow-y-auto p-6 space-y-5">
                        <button type="submit" id="taskFormSubmitBtn" class="hidden"></button>
                        <input type="text" id="taskTitle" required value="${editingTask ? escapeHtml(editingTask.title) : ''}" placeholder="タスクを入力" class="w-full bg-transparent border-b-2 border-gray-300 dark:border-gray-700 p-2 outline-none text-xl font-bold text-gray-900 dark:text-white">
                        <select id="taskCategory" class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 p-3 rounded-xl text-gray-900 dark:text-white outline-none">
                            <option value="">自動分類 (AI)</option>
                            ${categories.map(c => `<option value="${escapeHtml(c.name)}" ${editingTask && editingTask.category === c.name ? 'selected' : (defaultCategory===c.name?'selected':'')}>${c.name}</option>`).join('')}
                        </select>
                        <select id="taskSchedule" class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 p-3 rounded-xl text-gray-900 dark:text-white outline-none">
                            <option value="">期日なし</option>
                            <option value="Today" ${displaySchedule === 'Today' ? 'selected' : ''}>Today</option>
                            <option value="Week" ${displaySchedule === 'Week' ? 'selected' : ''}>Week</option>
                            <option value="Month" ${displaySchedule === 'Month' ? 'selected' : ''}>Month</option>
                            <option value="Daily" ${displaySchedule === 'Daily' ? 'selected' : ''}>Daily</option>
                            <option value="Weekly" ${displaySchedule === 'Weekly' ? 'selected' : ''}>Weekly</option>
                            <option value="Monthly" ${displaySchedule === 'Monthly' ? 'selected' : ''}>Monthly</option>
                        </select>
                        <textarea id="taskMemo" rows="3" oninput="tempMemo=this.value" placeholder="メモ..." class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 p-3 rounded-xl text-gray-900 dark:text-white outline-none resize-none">${escapeHtml(tempMemo)}</textarea>
                    </form>
                </div></div>`;
        }

        function renderSelectCategoryModal() {
            return `<div class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
                <div class="bg-white dark:bg-gray-900 w-full max-w-sm rounded-2xl p-6 shadow-2xl">
                    <h3 class="font-bold text-lg mb-4 text-gray-900 dark:text-white">カテゴリを選択</h3>
                    <div class="space-y-2 max-h-[50vh] overflow-y-auto">
                        ${categories.map(c => `<div onclick="window.selectAiCategory('${escapeHtml(c.name)}')" class="p-3 bg-gray-50 dark:bg-gray-800 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-xl cursor-pointer font-bold text-gray-800 dark:text-gray-200">${escapeHtml(c.name)}</div>`).join('')}
                    </div>
                    <button onclick="window.closeSelectCategoryModal()" class="mt-4 w-full bg-gray-200 dark:bg-gray-700 font-bold p-3 rounded-xl text-gray-800 dark:text-gray-200">キャンセル</button>
                </div></div>`;
        }

        window.toggleDarkMode = () => { isDarkMode = !isDarkMode; safeStorage.setItem('smart_theme', isDarkMode ? 'dark' : 'light'); render(); };
        window.selectFilter = (f) => { selectedFilter = f; selectedCategory = null; currentView = 'list'; render(); };
        window.selectCategory = (c) => { selectedCategory = c; selectedFilter = null; currentView = 'list'; render(); };
        window.openSettings = () => { currentView = 'settings'; render(); };
        
        window.openTaskModal = () => { editingTask = null; tempMemo = ''; defaultCategory = selectedCategory||''; defaultSchedule=''; isTaskModalOpen = true; render(); };
        window.closeTaskModal = () => { isTaskModalOpen = false; editingTask = null; render(); };
        window.editTask = (id) => { editingTask = tasks.find(t => t.id === id); tempMemo = editingTask.memo || ''; isTaskModalOpen = true; render(); };
        
        window.toggleTaskComplete = (id) => {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                if (task.completed) task.completedAt = Date.now();
                else delete task.completedAt;
                saveTaskToFirestore(task);
            }
        };

        window.handleTaskSubmit = (e) => {
            e.preventDefault();
            const title = document.getElementById('taskTitle').value;
            const category = document.getElementById('taskCategory').value;
            const schedule = document.getElementById('taskSchedule').value;

            let computedDueDate = '';
            if (schedule === 'Today') computedDueDate = getTodayStr();
            else if (schedule === 'Week') computedDueDate = getWeekendStr();
            else if (schedule === 'Month') computedDueDate = getMonthEndStr();
            else if (['Daily', 'Weekly', 'Monthly'].includes(schedule)) computedDueDate = getInitialDueDate(schedule, '');

            const baseTaskData = { title, schedule, dueDate: computedDueDate, memo: tempMemo, completed: false, createdAt: Date.now() };

            if (editingTask) {
                Object.assign(editingTask, baseTaskData);
                editingTask.category = category || editingTask.category;
                saveTaskToFirestore(editingTask);
                window.closeTaskModal();
            } else {
                if (!category) {
                    pendingAiTask = { taskData: { id: generateId(), ...baseTaskData, category: categories[0]?.name || '未分類' }};
                    isTaskModalOpen = false;
                    isSelectCategoryModalOpen = true;
                    render();
                } else {
                    saveTaskToFirestore({ id: generateId(), ...baseTaskData, category });
                    window.closeTaskModal();
                }
            }
        };

        window.openCustomModal = (type, data) => { 
            customModal = { isOpen: true, type, data }; 
            if (type === 'addList') {
                categoryFormState = { name: '', color: 'bg-blue-500', icon: 'list' };
            } else if (type === 'editList') {
                const cat = categories.find(c => c.id === data.id);
                if (cat) categoryFormState = { name: cat.name, color: cat.color || 'bg-blue-500', icon: cat.icon || 'list' };
            }
            render(); 
        };
        window.closeCustomModal = () => { customModal = { isOpen: false, type: '', data: null }; render(); };
        
        window.handleModalSubmit = () => {
            const { type, data } = customModal;
            if (type === 'addList') {
                if (categoryFormState.name.trim()) {
                    saveCategoryToFirestore({
                        id: generateId(),
                        name: categoryFormState.name.trim(),
                        color: categoryFormState.color,
                        icon: categoryFormState.icon
                    });
                }
            } else if (type === 'editList') {
                if (categoryFormState.name.trim()) {
                    const cat = categories.find(c => c.id === data.id);
                    if (cat) {
                        saveCategoryToFirestore({
                            ...cat,
                            name: categoryFormState.name.trim(),
                            color: categoryFormState.color,
                            icon: categoryFormState.icon
                        });
                    }
                }
            } else if (type === 'deleteList') {
                deleteCategoryFromFirestore(data.id);
            } else if (type === 'deleteTask') {
                deleteTaskFromFirestore(data.id);
            }
            window.closeCustomModal();
        };

        window.selectAiCategory = (catName) => {
            if (pendingAiTask) {
                pendingAiTask.taskData.category = catName;
                saveTaskToFirestore(pendingAiTask.taskData);
                pendingAiTask = null; isSelectCategoryModalOpen = false; render();
            }
        };

        window.closeSelectCategoryModal = () => {
            isSelectCategoryModalOpen = false;
            if (pendingAiTask) {
                editingTask = pendingAiTask.taskData;
                isTaskModalOpen = true;
                pendingAiTask = null;
            }
            render();
        };

        render();
    </script>
</body>
</html>
