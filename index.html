        function renderCustomModal() {
            if (customModal.type === 'addList' || customModal.type === 'editList') return renderCategoryModal();

            let title = '', content = '', actionBtn = '';
            if (customModal.type === 'deleteList') {
                title = 'リストの削除';
                content = `<p class="text-sm text-gray-600 dark:text-gray-300 mt-2 break-words">リスト「${escapeHtml(customModal.data.name)}」を削除しますか？<br><span class="text-xs text-red-500">※リスト内のタスクは消えません（カテゴリ未設定になります）</span></p>`;
                actionBtn = `<button onclick="window.handleModalSubmit()" class="flex-1 bg-red-500 hover:bg-red-600 text-white font-semibold p-3 rounded-xl transition">削除する</button>`;
            } else if (customModal.type === 'deleteTask') {
                title = 'タスクの削除';
                content = `<p class="text-sm text-gray-600 dark:text-gray-300 mt-2">このタスクを完全に削除しますか？</p>`;
                actionBtn = `<button onclick="window.handleModalSubmit()" class="flex-1 bg-red-500 hover:bg-red-600 text-white font-semibold p-3 rounded-xl transition">削除する</button>`;
            }

            return `
                <div class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
                    <div class="bg-white dark:bg-gray-900 w-full max-w-sm rounded-2xl p-6 shadow-2xl">
                        <h3 class="font-bold text-lg text-gray-900 dark:text-white">${title}</h3>
                        ${content}
                        <div class="flex gap-2 mt-6">
                            <button onclick="window.closeCustomModal()" class="flex-1 bg-gray-200 hover:bg-gray-300 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-800 dark:text-gray-200 font-semibold p-3 rounded-xl transition">キャンセル</button>
                            ${actionBtn}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderCategoryModal() {
            return `
                <div class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
                    <div class="bg-white dark:bg-gray-900 w-full max-w-md rounded-t-3xl sm:rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[85vh]">
                        <div class="p-6 flex-1 overflow-y-auto space-y-6">
                            <div class="flex justify-center -mt-2 mb-4">
                                <div class="w-16 h-16 rounded-full shadow-lg flex items-center justify-center text-white text-3xl ${categoryFormState.color}">
                                    ${renderIcon(categoryFormState.icon)}
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-500 mb-1.5">カテゴリ名</label>
                                <input type="text" value="${escapeHtml(categoryFormState.name)}" oninput="window.updateCategoryName(this.value)" placeholder="リスト名を入力" class="w-full bg-transparent border-b-2 border-gray-300 dark:border-gray-700 p-2 outline-none focus:border-blue-500 text-lg font-bold text-gray-900 dark:text-white transition">
                            </div>
                            <div class="bg-gray-50 dark:bg-gray-800/50 p-4 rounded-2xl">
                                <label class="block text-xs font-semibold text-gray-500 mb-3">カラー</label>
                                <div class="flex flex-wrap gap-3">
                                    ${availableColors.map(color => `
                                        <button onclick="window.updateCategoryForm('color', '${color}')" class="w-10 h-10 rounded-full ${color} flex items-center justify-center transition transform hover:scale-110 ${categoryFormState.color === color ? 'ring-4 ring-offset-2 ring-gray-300 dark:ring-gray-600' : ''}">
                                            ${categoryFormState.color === color ? '<i data-lucide="check" class="w-5 h-5 text-white"></i>' : ''}
                                        </button>
                                    `).join('')}
                                </div>
                            </div>
                            <div class="bg-gray-50 dark:bg-gray-800/50 p-4 rounded-2xl">
                                <label class="block text-xs font-semibold text-gray-500 mb-3">アイコン</label>
                                <div class="grid grid-cols-6 sm:grid-cols-8 gap-3 max-h-[30vh] overflow-y-auto pr-1">
                                    ${availableIcons.map(icon => `
                                        <button onclick="window.updateCategoryForm('icon', '${icon}')" class="w-10 h-10 rounded-xl flex items-center justify-center transition ${categoryFormState.icon === icon ? 'bg-gray-300 dark:bg-gray-600 text-gray-900 dark:text-white shadow-inner' : 'text-gray-500 hover:bg-gray-200 dark:hover:bg-gray-700'}">
                                            <i data-lucide="${icon}" class="w-5 h-5"></i>
                                        </button>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                        <div class="p-4 border-t border-gray-100 dark:border-gray-800 flex gap-2 bg-white dark:bg-gray-900">
                            <button onclick="window.closeCustomModal()" class="flex-1 bg-gray-100 hover:bg-gray-200 dark:bg-gray-800 dark:hover:bg-gray-700 text-gray-800 dark:text-gray-200 font-bold p-4 rounded-xl transition">キャンセル</button>
                            <button onclick="window.handleModalSubmit()" class="flex-1 bg-blue-500 hover:bg-blue-600 text-white font-bold p-4 rounded-xl transition shadow-md">保存</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderTaskModal() {
            const currentTask = editingTask || taskFormDraft;
            const schedBase = currentTask ? (currentTask.schedule || '').replace('_Completed', '').replace('_Expired', '') : '';
            const isCustom = schedBase === 'Custom';
            const displaySchedule = currentTask ? schedBase : defaultSchedule;

            return `
                <div class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
                    <div class="bg-white dark:bg-gray-900 w-full sm:max-w-lg rounded-t-3xl sm:rounded-2xl shadow-2xl flex flex-col max-h-[90vh]">
                        <div class="flex items-center justify-between p-4 border-b border-gray-100 dark:border-gray-800 bg-white dark:bg-gray-900 rounded-t-3xl sm:rounded-2xl z-10 flex-shrink-0">
                            <button onclick="window.closeTaskModal()" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-500 transition"><i data-lucide="x" class="w-6 h-6"></i></button>
                            <h3 class="font-bold text-lg text-gray-900 dark:text-white">${editingTask ? '編集' : '新規タスク'}</h3>
                            <button onclick="document.getElementById('taskFormSubmitBtn').click()" class="p-2 rounded-full hover:bg-blue-50 dark:hover:bg-blue-900/30 text-blue-500 transition"><i data-lucide="check" class="w-6 h-6"></i></button>
                        </div>

                        <form id="taskForm" onsubmit="window.handleTaskSubmit(event)" class="flex-1 overflow-y-auto p-6 space-y-5 pb-32">
                            <button type="submit" id="taskFormSubmitBtn" class="hidden"></button>
                            
                            <div>
                                <input type="text" id="taskTitle" required value="${currentTask ? escapeHtml(currentTask.title) : ''}" placeholder="タスクを入力" class="w-full bg-transparent border-b-2 border-gray-300 dark:border-gray-700 p-2 outline-none focus:border-blue-500 text-xl font-bold text-gray-900 dark:text-white transition">
                            </div>
                            
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-semibold text-gray-500 mb-1.5">カテゴリ</label>
                                    <select id="taskCategory" class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl p-3 text-sm outline-none focus:border-blue-500 text-gray-900 dark:text-white transition">
                                        <option value="">自動分類 (AI)</option>
                                        ${categories.map(c => `<option value="${escapeHtml(c.name)}" ${currentTask && currentTask.category === c.name ? 'selected' : (defaultCategory === c.name ? 'selected' : '')}>${c.name}</option>`).join('')}
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-gray-500 mb-1.5">優先度</label>
                                    <select id="taskPriority" class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl p-3 text-sm outline-none focus:border-blue-500 text-gray-900 dark:text-white transition">
                                        <option value="none" ${(!currentTask || currentTask.priority === 'none') ? 'selected' : ''}>なし</option>
                                        <option value="low" ${currentTask && currentTask.priority === 'low' ? 'selected' : ''}>低</option>
                                        <option value="medium" ${currentTask && currentTask.priority === 'medium' ? 'selected' : ''}>中</option>
                                        <option value="high" ${currentTask && currentTask.priority === 'high' ? 'selected' : ''}>高</option>
                                    </select>
                                </div>
                            </div>

                            <div>
                                <label class="block text-xs font-semibold text-gray-500 mb-1.5">期限</label>
                                <select id="taskSchedule" onchange="window.toggleScheduleDetails()" class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl p-3 text-sm outline-none focus:border-blue-500 text-gray-900 dark:text-white transition">
                                    <option value="">なし</option>
                                    <option value="Today" ${displaySchedule === 'Today' ? 'selected' : ''}>Today</option>
                                    <option value="Week" ${displaySchedule === 'Week' ? 'selected' : ''}>Week</option>
                                    <option value="Month" ${displaySchedule === 'Month' ? 'selected' : ''}>Month</option>
                                    <option value="Daily" ${displaySchedule === 'Daily' ? 'selected' : ''}>Daily</option>
                                    <option value="Weekly" ${displaySchedule === 'Weekly' ? 'selected' : ''}>Weekly</option>
                                    <option value="Monthly" ${displaySchedule === 'Monthly' ? 'selected' : ''}>Monthly</option>
                                    <option value="Custom" ${isCustom ? 'selected' : ''}>直接日付を選択</option>
                                </select>
                            </div>
                            <div id="recurringDetailContainer" class="hidden">
                                <label class="block text-xs font-semibold text-gray-500 mb-1.5" id="recurringDetailLabel">詳細</label>
                                <select id="taskRecurringDetail" class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl p-3 text-sm outline-none focus:border-blue-500 text-gray-900 dark:text-white transition"></select>
                            </div>
                            <div id="customDateContainer" class="${isCustom ? '' : 'hidden'}">
                                <label class="block text-xs font-semibold text-gray-500 mb-1.5">日付を選択</label>
                                <input type="date" id="taskCustomDate" value="${isCustom && currentTask.dueDate ? currentTask.dueDate : ''}" class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl p-3 text-sm outline-none focus:border-blue-500 text-gray-900 dark:text-white transition">
                            </div>

                            <div>
                                <label class="block text-xs font-semibold text-gray-500 mb-1.5">場所</label>
                                <select id="taskLocation" class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl p-3 text-sm outline-none focus:border-blue-500 text-gray-900 dark:text-white transition">
                                    <option value="none" ${!currentTask || currentTask.location === 'none' || !currentTask.location ? 'selected' : ''}>指定なし</option>
                                    <option value="home" ${currentTask && currentTask.location === 'home' ? 'selected' : ''}>自宅</option>
                                    <option value="work" ${currentTask && currentTask.location === 'work' ? 'selected' : ''}>職場</option>
                                    <option value="outing" ${currentTask && currentTask.location === 'outing' ? 'selected' : ''}>外出先</option>
                                </select>
                            </div>

                            <div>
                                <label class="block text-xs font-semibold text-gray-500 mb-1.5"><i data-lucide="link" class="w-3.5 h-3.5 inline mr-1"></i>URL (任意)</label>
                                <input type="url" id="taskUrl" value="${currentTask ? escapeHtml(currentTask.url) : ''}" placeholder="https://..." class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl p-3 text-sm outline-none focus:border-blue-500 text-gray-900 dark:text-white transition">
                            </div>

                            <div>
                                <label class="block text-xs font-semibold text-gray-500 mb-1.5"><i data-lucide="align-left" class="w-3.5 h-3.5 inline mr-1"></i>メモ</label>
                                <textarea id="taskMemo" rows="3" oninput="window.updateTempMemo(this.value)" placeholder="メモを入力..." class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl p-3 text-sm outline-none focus:border-blue-500 text-gray-900 dark:text-white transition resize-none">${escapeHtml(tempMemo)}</textarea>
                            </div>

                            <div>
                                <label class="block text-xs font-semibold text-gray-500 mb-1.5"><i data-lucide="check-square" class="w-3.5 h-3.5 inline mr-1"></i>サブタスク</label>
                                <div class="space-y-2 mb-2" id="subtasksContainer">
                                    ${taskFormSubtasks.map((st, i) => `
                                        <div class="flex items-center gap-2 bg-gray-50 dark:bg-gray-800 p-2 rounded-lg border border-gray-200 dark:border-gray-700">
                                            <input type="text" value="${escapeHtml(st.title)}" oninput="window.updateSubtaskTitle(${i}, this.value)" class="flex-1 bg-transparent outline-none text-sm text-gray-900 dark:text-white">
                                            <button type="button" onclick="window.removeSubtask(${i})" class="p-1 text-red-500 hover:bg-red-50 dark:hover:bg-red-900/30 rounded"><i data-lucide="x" class="w-4 h-4"></i></button>
                                        </div>
                                    `).join('')}
                                </div>
                                <div class="flex items-center gap-2">
                                    <input type="text" id="newSubtaskInput" placeholder="サブタスクを追加..." class="flex-1 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl p-3 text-sm outline-none focus:border-blue-500 text-gray-900 dark:text-white transition">
                                    <button type="button" onclick="window.addSubtask()" class="bg-blue-100 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 p-3 rounded-xl hover:bg-blue-200 transition font-bold">追加</button>
                                </div>
                            </div>

                            <div>
                                <label class="block text-xs font-semibold text-gray-500 mb-1.5"><i data-lucide="paperclip" class="w-3.5 h-3.5 inline mr-1"></i>添付ファイル (写真 / PDF)</label>
                                <div class="flex flex-wrap gap-2 mb-2" id="attachmentsContainer">
                                    ${taskFormAttachments.map((att, i) => `
                                        <div class="relative w-20 h-20 rounded-xl overflow-hidden border border-gray-200 dark:border-gray-700 group">
                                            ${att.type.startsWith('image/') 
                                                ? `<img src="${att.data}" class="w-full h-full object-cover cursor-zoom-in" onclick="window.openImageViewer('${att.data}')">` 
                                                : `<div class="w-full h-full bg-gray-100 flex flex-col items-center justify-center text-xs text-gray-500 font-bold"><i data-lucide="file-text" class="w-6 h-6 mb-1"></i>PDF</div>`
                                            }
                                            <button type="button" onclick="window.removeAttachment(${i})" class="absolute top-1 right-1 bg-red-500 text-white rounded-full p-1 opacity-0 group-hover:opacity-100 transition z-10"><i data-lucide="x" class="w-3 h-3"></i></button>
                                        </div>
                                    `).join('')}
                                </div>
                                <button type="button" onclick="document.getElementById('taskAttachmentInput').click()" class="w-full border-2 border-dashed border-gray-300 dark:border-gray-600 rounded-xl p-4 text-sm text-gray-500 hover:text-blue-500 hover:border-blue-500 hover:bg-blue-50 dark:hover:bg-gray-800 transition flex items-center justify-center gap-2 font-semibold">
                                    <i data-lucide="camera" class="w-5 h-5"></i>ファイルを選択 / 撮影
                                </button>
                                <input type="file" id="taskAttachmentInput" class="hidden" accept="image/*,application/pdf" multiple onchange="window.handleFileUpload(event)">
                            </div>

                        </form>
                    </div>
                </div>
            `;
        }

        function renderImageViewer() {
            return `
                <div class="fixed inset-0 z-[60] bg-black/90 flex items-center justify-center p-4" onclick="window.closeImageViewer()">
                    <img src="${viewingImage}" class="max-w-full max-h-full object-contain rounded-lg shadow-2xl" onclick="event.stopPropagation()">
                    <button onclick="window.closeImageViewer()" class="absolute top-4 right-4 text-white hover:text-gray-300 p-2"><i data-lucide="x" class="w-8 h-8"></i></button>
                </div>
            `;
        }

        function renderAiConfirmModal() {
            const isLearned = pendingAiTask.aiResult.isLearned;
            return `
                <div class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
                    <div class="bg-white dark:bg-gray-900 w-full max-w-sm rounded-2xl p-6 shadow-2xl space-y-4">
                        <h3 class="font-bold text-lg text-gray-900 dark:text-white">${isLearned ? '✨ 過去の履歴から予測' : 'AI自動カテゴライズ'}</h3>
                        <p class="text-sm text-gray-600 dark:text-gray-300">以下のカテゴリに分類されました。よろしいですか？</p>
                        <div class="bg-gray-50 dark:bg-gray-800 p-4 rounded-xl flex items-center gap-3 border border-gray-100 dark:border-gray-700">
                            <div class="w-10 h-10 rounded-full bg-blue-500 flex items-center justify-center text-white">${renderIcon(pendingAiTask.aiResult.icon)}</div>
                            <div>
                                <p class="text-xs text-gray-400 font-semibold">推論されたカテゴリ</p>
                                <p class="font-bold text-lg text-gray-900 dark:text-white">${escapeHtml(pendingAiTask.aiResult.category)}</p>
                            </div>
                        </div>
                        <div class="flex gap-2 pt-2">
                            <button onclick="window.openSelectCategoryModal()" class="flex-1 bg-gray-200 hover:bg-gray-300 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-800 dark:text-gray-200 font-semibold p-3 rounded-xl transition">修正する</button>
                            <button onclick="window.confirmAiTask(true)" class="flex-1 bg-blue-500 hover:bg-blue-600 text-white font-semibold p-3 rounded-xl transition shadow-md">確定する</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderSelectCategoryModal() {
            return `
                <div class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
                    <div class="bg-white dark:bg-gray-900 w-full max-w-sm rounded-2xl p-6 shadow-2xl flex flex-col max-h-[80vh]">
                        <h3 class="font-bold text-lg text-gray-900 dark:text-white mb-4">カテゴリを選択</h3>
                        <div class="flex-1 overflow-y-auto space-y-2">
                            ${categories.map(c => `
                                <div onclick="window.selectAiCategory('${escapeHtml(c.name)}')" class="flex items-center gap-3 p-3 rounded-xl hover:bg-blue-50 dark:hover:bg-gray-800 cursor-pointer transition border border-gray-100 dark:border-gray-800">
                                    <div class="w-8 h-8 rounded-full ${escapeHtml(c.color)} flex items-center justify-center text-white">${renderIcon(c.icon)}</div>
                                    <span class="font-semibold text-gray-800 dark:text-gray-200">${escapeHtml(c.name)}</span>
                                </div>
                            `).join('')}
                        </div>
                        <button onclick="window.closeSelectCategoryModal()" class="mt-4 w-full bg-gray-100 hover:bg-gray-200 dark:bg-gray-800 text-gray-800 dark:text-gray-200 font-bold p-3 rounded-xl transition">キャンセル</button>
                    </div>
                </div>
            `;
        }

        window.navigate = (view) => { currentView = view; if (view === 'home') isListEditMode = false; render(); };
        window.toggleListEditMode = () => { isListEditMode = !isListEditMode; render(); };
        window.selectCategory = (catName) => { 
            selectedCategory = catName; selectedFilter = null; currentView = 'list'; 
            localFilterLocation = 'all'; localFilterPriority = 'all'; localFilterSchedule = 'all';
            render(); 
        };
        window.selectFilter = (filterName) => { 
            selectedFilter = filterName; selectedCategory = null; currentView = 'list'; 
            localFilterLocation = 'all'; localFilterPriority = 'all'; localFilterCategory = 'all';
            render(); 
        };
        window.openSettings = () => { currentView = 'settings'; selectedCategory = null; selectedFilter = null; render(); };
        window.toggleDarkMode = () => { isDarkMode = !isDarkMode; safeStorage.setItem('smart_theme', isDarkMode ? 'dark' : 'light'); render(); };
        window.toggleSearch = () => { isSearchOpen = !isSearchOpen; if (!isSearchOpen) searchQuery = ''; render(); };
        window.updateSearchQuery = (val) => { searchQuery = val; render(); };
        
        window.updateLocalFilters = () => {
            localFilterLocation = document.getElementById('localFilterLocation')?.value || 'all';
            localFilterPriority = document.getElementById('localFilterPriority')?.value || 'all';
            localFilterCategory = document.getElementById('localFilterCategory')?.value || 'all';
            localFilterSchedule = document.getElementById('localFilterSchedule')?.value || 'all';
            render();
        };
        
        window.updateCategoryForm = (key, val) => { categoryFormState[key] = val; render(); };
        window.updateCategoryName = (val) => { categoryFormState.name = val; };
        
        window.openCustomModal = (type, data = null) => { 
            customModal = { isOpen: true, type, data }; 
            if (type === 'addList') { categoryFormState = { name: '', color: 'bg-blue-500', icon: 'list' }; }
            if (type === 'editList') { 
                const cat = categories.find(c => c.id === data.id);
                if (cat) categoryFormState = { name: cat.name, color: cat.color || 'bg-blue-500', icon: cat.icon || 'list' };
            }
            render(); 
        };
        window.closeCustomModal = () => { customModal = { isOpen: false, type: '', data: null }; render(); };

        window.handleModalSubmit = async () => {
            const { type, data } = customModal;
            if (type === 'addList') {
                if (categoryFormState.name.trim()) {
                    const newCat = { id: generateId(), name: categoryFormState.name.trim(), icon: categoryFormState.icon, color: categoryFormState.color };
                    categories.push(newCat);
                    saveCategoryToDB(newCat);
                    window.closeCustomModal();
                }
            } else if (type === 'editList') {
                if (categoryFormState.name.trim()) {
                    const cat = categories.find(c => c.id === data.id);
                    if (cat) {
                        const oldName = cat.name;
                        cat.name = categoryFormState.name.trim(); cat.color = categoryFormState.color; cat.icon = categoryFormState.icon;
                        tasks.forEach(t => { 
                            if (t.category === oldName) {
                                t.category = cat.name;
                                saveTaskToDB(t);
                            }
                        });
                        if (selectedCategory === oldName) selectedCategory = cat.name;
                        saveCategoryToDB(cat);
                        window.closeCustomModal();
                    }
                }
            } else if (type === 'deleteList') {
                if (selectedCategory === data.name) { selectedCategory = null; selectedFilter = 'Today'; }
                categories = categories.filter(c => c.id !== data.id);
                deleteCategoryFromDB(data.id);
                tasks.forEach(t => { 
                    if (t.category === data.name) {
                        t.category = ''; 
                        saveTaskToDB(t);
                    }
                });
                window.closeCustomModal();
            } else if (type === 'deleteTask') {
                tasks = tasks.filter(t => t.id !== data.id);
                deleteTaskFromDB(data.id);
                window.closeCustomModal();
            }
        };

        window.openSelectCategoryModal = () => { isSelectCategoryModalOpen = true; render(); };
        window.closeSelectCategoryModal = () => { 
            isSelectCategoryModalOpen = false; 
            if (pendingAiTask) {
                const draft = pendingAiTask.taskData;
                pendingAiTask = null;
                window.openTaskModalWithDraft(draft);
                return;
            }
            render(); 
        };
        window.selectAiCategory = (catName) => {
            if (pendingAiTask) {
                pendingAiTask.taskData.category = catName;
                window.insertTaskAtProperPosition(pendingAiTask.taskData);
                saveTaskToDB(pendingAiTask.taskData);
                pendingAiTask = null; isSelectCategoryModalOpen = false; render();
            }
        };

        window.updateTempMemo = (val) => { tempMemo = val; };
        
        window.toggleScheduleDetails = () => {
            const schedule = document.getElementById('taskSchedule').value;
            const customContainer = document.getElementById('customDateContainer');
            const recurringContainer = document.getElementById('recurringDetailContainer');
            const recurringSelect = document.getElementById('taskRecurringDetail');

            if(customContainer && recurringContainer && recurringSelect) {
                customContainer.classList.add('hidden');
                recurringContainer.classList.add('hidden');

                const currentTask = editingTask || taskFormDraft;
                if (schedule === 'Custom') customContainer.classList.remove('hidden');
                else if (schedule === 'Weekly') {
                    recurringContainer.classList.remove('hidden');
                    document.getElementById('recurringDetailLabel').textContent = '曜日を選択';
                    recurringSelect.innerHTML = `<option value="">指定なし</option><option value="0">日曜日</option><option value="1">月曜日</option><option value="2">火曜日</option><option value="3">水曜日</option><option value="4">木曜日</option><option value="5">金曜日</option><option value="6">土曜日</option>`;
                    recurringSelect.value = (currentTask && currentTask.recurringDetail !== undefined) ? currentTask.recurringDetail : '';
                } else if (schedule === 'Monthly') {
                    recurringContainer.classList.remove('hidden');
                    document.getElementById('recurringDetailLabel').textContent = '日付を選択';
                    let opts = `<option value="">指定なし</option>`; for (let i = 1; i <= 31; i++) opts += `<option value="${i}">${i}日</option>`; opts += `<option value="last">月末</option>`;
                    recurringSelect.innerHTML = opts;
                    recurringSelect.value = (currentTask && currentTask.recurringDetail !== undefined) ? currentTask.recurringDetail : '';
                }
            }
        };

        window.refreshSubtasksDOM = () => {
            const container = document.getElementById('subtasksContainer');
            if (container) {
                container.innerHTML = taskFormSubtasks.map((st, i) => `
                    <div class="flex items-center gap-2 bg-gray-50 dark:bg-gray-800 p-2 rounded-lg border border-gray-200 dark:border-gray-700">
                        <input type="text" value="${escapeHtml(st.title)}" oninput="window.updateSubtaskTitle(${i}, this.value)" class="flex-1 bg-transparent outline-none text-sm text-gray-900 dark:text-white">
                        <button type="button" onclick="window.removeSubtask(${i})" class="p-1 text-red-500 hover:bg-red-50 dark:hover:bg-red-900/30 rounded"><i data-lucide="x" class="w-4 h-4"></i></button>
                    </div>
                `).join('');
                if (typeof lucide !== 'undefined') lucide.createIcons({root: container});
            }
        };

        window.addSubtask = () => {
            const input = document.getElementById('newSubtaskInput');
            const val = input.value.trim();
            if (val) {
                taskFormSubtasks.push({ title: val, completed: false });
                input.value = '';
                window.refreshSubtasksDOM();
            }
        };
        window.removeSubtask = (idx) => { taskFormSubtasks.splice(idx, 1); window.refreshSubtasksDOM(); };
        window.updateSubtaskTitle = (idx, val) => { taskFormSubtasks[idx].title = val; };
        
        window.toggleListSubtask = (taskId, idx) => {
            const t = tasks.find(x => x.id === taskId);
            if (t && t.subtasks && t.subtasks[idx]) { 
                t.subtasks[idx].completed = !t.subtasks[idx].completed; 
                saveTaskToDB(t); 
            }
        };

        window.refreshAttachmentsDOM = () => {
            const container = document.getElementById('attachmentsContainer');
            if (container) {
                container.innerHTML = taskFormAttachments.map((att, i) => `
                    <div class="relative w-20 h-20 rounded-xl overflow-hidden border border-gray-200 dark:border-gray-700 group">
                        ${att.type.startsWith('image/') 
                            ? `<img src="${att.data}" class="w-full h-full object-cover cursor-zoom-in" onclick="window.openImageViewer('${att.data}')">` 
                            : `<div class="w-full h-full bg-gray-100 flex flex-col items-center justify-center text-xs text-gray-500 font-bold"><i data-lucide="file-text" class="w-6 h-6 mb-1"></i>PDF</div>`
                        }
                        <button type="button" onclick="window.removeAttachment(${i})" class="absolute top-1 right-1 bg-red-500 text-white rounded-full p-1 opacity-0 group-hover:opacity-100 transition z-10"><i data-lucide="x" class="w-3 h-3"></i></button>
                    </div>
                `).join('');
                if (typeof lucide !== 'undefined') lucide.createIcons({root: container});
            }
        };

        window.handleFileUpload = (e) => {
            const files = e.target.files;
            for (let file of files) {
                if (file.size > 2 * 1024 * 1024) { alert('ファイルサイズは2MB以下にしてください。'); continue; }
                const reader = new FileReader();
                reader.onload = (event) => {
                    taskFormAttachments.push({ name: file.name, type: file.type, data: event.target.result });
                    window.refreshAttachmentsDOM();
                };
                reader.readAsDataURL(file);
            }
        };
        window.removeAttachment = (idx) => { taskFormAttachments.splice(idx, 1); window.refreshAttachmentsDOM(); };

        window.openImageViewer = (src) => { viewingImage = src; render(); };
        window.closeImageViewer = () => { viewingImage = null; render(); };

        window.openTaskModal = () => { 
            editingTask = null; 
            taskFormDraft = null;
            tempMemo = ''; taskFormSubtasks = []; taskFormAttachments = []; 
            defaultCategory = selectedCategory || '';
            defaultSchedule = '';
            if (!selectedCategory && selectedFilter && ['Today', 'Week', 'Month', 'Daily', 'Weekly', 'Monthly'].includes(selectedFilter)) {
                defaultSchedule = selectedFilter;
            }
            isTaskModalOpen = true; 
            render(); 
            setTimeout(window.toggleScheduleDetails, 50); 
        };
        window.openTaskModalWithDraft = (draft) => {
            editingTask = null;
            taskFormDraft = draft;
            tempMemo = draft.memo || '';
            taskFormSubtasks = draft.subtasks ? JSON.parse(JSON.stringify(draft.subtasks)) : [];
            taskFormAttachments = draft.attachments ? [...draft.attachments] : [];
            defaultCategory = draft.category || '';
            defaultSchedule = draft.schedule || '';
            isTaskModalOpen = true;
            render();
            setTimeout(window.toggleScheduleDetails, 50);
        };
        window.closeTaskModal = () => { isTaskModalOpen = false; editingTask = null; taskFormDraft = null; render(); };
        window.editTask = (id) => { 
            editingTask = tasks.find(t => t.id === id); 
            taskFormDraft = null;
            tempMemo = editingTask.memo || ''; taskFormSubtasks = editingTask.subtasks ? JSON.parse(JSON.stringify(editingTask.subtasks)) : []; taskFormAttachments = editingTask.attachments ? [...editingTask.attachments] : [];
            isTaskModalOpen = true; render(); setTimeout(window.toggleScheduleDetails, 50); 
        };
        
        window.toggleTaskComplete = (id) => {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                if (task.completed) {
                    task.completedAt = Date.now();
                    
                    const schedBase = task.schedule ? task.schedule.replace('_Completed', '').replace('_Expired', '') : '';
                    if (['Daily', 'Weekly', 'Monthly'].includes(schedBase) && !(task.schedule || '').includes('_Completed')) {
                        const nextDue = getNextDueDate(schedBase, task.recurringDetail, task.dueDate || getTodayStr());
                        const newTask = { ...task, id: generateId(), dueDate: nextDue, completed: false, createdAt: Date.now() };
                        delete newTask.completedAt;
                        
                        task.schedule = schedBase + '_Completed';
                        
                        tasks.push(newTask);
                        saveTaskToDB(newTask);
                    }
                } else {
                    delete task.completedAt;
                    // 再度未完了に戻した時、_Completed を外す処理を入れるかは運用次第だが、単純に完了取り消しとする
                }
                window.insertTaskAtProperPosition(task);
                saveTaskToDB(task);
                render();
            }
        };

        window.handleTaskSubmit = async (e) => {
            e.preventDefault();
            const title = document.getElementById('taskTitle').value;
            const category = document.getElementById('taskCategory').value;
            const priority = document.getElementById('taskPriority').value;
            const location = document.getElementById('taskLocation').value;
            const schedule = document.getElementById('taskSchedule').value;
            const customDate = document.getElementById('taskCustomDate').value;
            const recurringDetail = document.getElementById('taskRecurringDetail')?.value || '';
            const url = document.getElementById('taskUrl').value;

            let computedDueDate = '';
            if (schedule === 'Today') computedDueDate = getTodayStr();
            else if (schedule === 'Week') computedDueDate = getWeekendStr();
            else if (schedule === 'Month') computedDueDate = getMonthEndStr();
            else if (['Daily', 'Weekly', 'Monthly'].includes(schedule)) computedDueDate = getInitialDueDate(schedule, recurringDetail);
            else if (schedule === 'Custom') computedDueDate = customDate;

            const baseTaskData = {
                title, url, priority, location, schedule, recurringDetail, dueDate: computedDueDate, 
                memo: tempMemo, subtasks: taskFormSubtasks, attachments: taskFormAttachments
            };

            if (editingTask) {
                Object.assign(editingTask, baseTaskData);
                editingTask.category = category || editingTask.category;
                saveTaskToDB(editingTask);
                taskFormDraft = null;
                window.closeTaskModal();
            } else if (!category) {
                const aiResult = await aiCategorizeAndIcon(title);
                pendingAiTask = {
                    taskData: { id: generateId(), ...baseTaskData, completed: false, createdAt: Date.now() },
                    aiResult
                };
                isTaskModalOpen = false; render();
            } else {
                const newTask = { id: generateId(), ...baseTaskData, category, completed: false, createdAt: Date.now() };
                taskFormDraft = null;
                window.insertTaskAtProperPosition(newTask);
                saveTaskToDB(newTask);
                window.closeTaskModal();
            }
        };

        window.confirmAiTask = (accepted) => {
            if (accepted && pendingAiTask) {
                let catName = pendingAiTask.aiResult.category;
                if (!categories.some(c => c.name === catName)) {
                    const newCat = { id: generateId(), name: catName, icon: pendingAiTask.aiResult.icon, color: 'bg-blue-500' };
                    categories.push(newCat);
                    saveCategoryToDB(newCat);
                }
                pendingAiTask.taskData.category = catName;
                window.insertTaskAtProperPosition(pendingAiTask.taskData);
                saveTaskToDB(pendingAiTask.taskData);
                pendingAiTask = null; render();
            }
        };

        window.loginWithGoogle = () => {
            const provider = new GoogleAuthProvider();
            signInWithPopup(auth, provider).catch((error) => {
                alert('ログインに失敗しました。\n' + error.message);
                console.error(error);
            });
        };

        window.logout = () => {
            signOut(auth).catch((error) => console.error(error));
        };

        function subscribeData(uid) {
            if (unsubscribeTasks) unsubscribeTasks();
            if (unsubscribeCategories) unsubscribeCategories();

            unsubscribeTasks = onSnapshot(collection(db, 'users', uid, 'tasks'), (snapshot) => {
                let newTasks = [];
                snapshot.forEach(doc => newTasks.push(doc.data()));
                tasks = newTasks;
                saveTasksToLocal();
                
                // Firestoreからの読み込み後も期限チェックを行う
                if(!processRecurringTasks()) {
                    render(); // 更新がなければ単純にrender
                }
            }, (error) => console.error("Tasks sync error:", error));

            unsubscribeCategories = onSnapshot(collection(db, 'users', uid, 'categories'), (snapshot) => {
                let newCats = [];
                snapshot.forEach(doc => newCats.push(doc.data()));
                if(newCats.length > 0) {
                    categories = newCats;
                    saveCategoriesToLocal();
                }
                render();
            }, (error) => console.error("Categories sync error:", error));
        }

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                subscribeData(user.uid);
            } else {
                if (unsubscribeTasks) unsubscribeTasks();
                if (unsubscribeCategories) unsubscribeCategories();
                // 匿名ログインにフォールバック（外部アクセス時用）
                signInAnonymously(auth).catch(console.error);
            }
        });

        // 初回ロード時の期限チェック・描画
        if(!processRecurringTasks()) {
            render();
        }

    </script>
</body>
</html>
