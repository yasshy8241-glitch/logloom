<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogLoom</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Sortable.js -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 transition-colors duration-300 w-full h-screen overflow-hidden" id="bodyRoot">

    <div id="app" class="w-full h-full relative">
        <div class="flex flex-col items-center justify-center min-h-screen">
            <p class="text-gray-400 font-semibold animate-pulse">Loading LogLoom...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ユーザー指定のFirebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyDrP9nAgF-J9ISkPTr0LAC_EeDmDpEWPNw",
            authDomain: "reminder-5f9ca.firebaseapp.com",
            projectId: "reminder-5f9ca",
            storageBucket: "reminder-5f9ca.firebasestorage.app",
            messagingSenderId: "1068531232868",
            appId: "1:1068531232868:web:cf1d7da63f961a391b2f71"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        let currentUser = null;
        let unsubscribeTasks = null;
        let unsubscribeCategories = null;

        window.addEventListener('error', function(event) {
            const appEl = document.getElementById('app');
            if (appEl) {
                appEl.innerHTML = `<div class="p-8 h-full bg-white flex flex-col justify-center items-center text-center">
                    <div class="text-red-500 font-bold text-xl mb-4">⚠️ 起動エラーが発生しました</div>
                    <p class="text-gray-600 text-sm mb-4">${event.message}</p>
                    <button onclick="localStorage.clear(); location.reload();" class="bg-blue-500 text-white px-6 py-2 rounded-xl font-bold">データをリセットして再起動</button>
                </div>`;
            }
        });

        let inMemoryStorage = {};
        const safeStorage = {
            getItem(key) { try { return localStorage.getItem(key); } catch (e) { return inMemoryStorage[key] || null; } },
            setItem(key, value) { try { localStorage.setItem(key, value); } catch (e) { inMemoryStorage[key] = value; } }
        };

        const availableIcons = [
            'list', 'home', 'heart', 'gem', 'lightbulb', 'gift', 'cake', 'shopping-cart',
            'utensils', 'coffee', 'shield', 'landmark', 'credit-card', 'receipt', 'ticket', 'plane',
            'briefcase', 'bus', 'car', 'gamepad-2', 'dumbbell', 'trophy', 'activity', 'building',
            'building-2', 'graduation-cap', 'book', 'pen-tool', 'clock', 'users', 'smile',
            'alarm-clock', 'leaf', 'feather', 'bookmark', 'newspaper', 'wrench', 'zap', 'star', 
            'music', 'camera', 'headphones', 'mic', 'video', 'map-pin', 'navigation', 'compass', 'bell'
        ];

        const availableColors = [
            'bg-red-500', 'bg-orange-500', 'bg-amber-500', 'bg-green-500', 'bg-emerald-500', 'bg-teal-500',
            'bg-blue-500', 'bg-cyan-500', 'bg-indigo-500', 'bg-purple-500', 'bg-pink-500', 'bg-rose-500',
            'bg-gray-500', 'bg-slate-700', 'bg-black'
        ];

        function renderIcon(iconName) {
            if (iconName && !iconName.match(/^[a-zA-Z0-9-]+$/)) return `<span>${iconName}</span>`;
            const name = iconName || 'list';
            return `<i data-lucide="${name}" class="w-4 h-4"></i>`;
        }

        let tasks = [];
        let categories = [];
        
        try {
            let parsedTasks = JSON.parse(safeStorage.getItem('smart_tasks'));
            tasks = Array.isArray(parsedTasks) ? parsedTasks : [];
            let parsedCats = JSON.parse(safeStorage.getItem('smart_categories'));
            categories = Array.isArray(parsedCats) ? parsedCats : [];
            if (categories.length === 0) {
                categories = [
                    { id: '1', name: 'To Do', icon: 'list', color: 'bg-blue-500' },
                    { id: '2', name: '買い物', icon: 'shopping-cart', color: 'bg-orange-500' },
                    { id: '3', name: '仕事', icon: 'briefcase', color: 'bg-indigo-500' },
                    { id: '4', name: 'アイデア', icon: 'lightbulb', color: 'bg-amber-500' }
                ];
            }
        } catch(e) {
            tasks = []; categories = [ { id: '1', name: 'To Do', icon: 'list', color: 'bg-blue-500' } ];
        }
        
        let currentView = 'home'; 
        let selectedCategory = null;
        let selectedFilter = 'Today'; 
        let isDarkMode = safeStorage.getItem('smart_theme') === 'dark';
        let isSearchOpen = false;
        let searchQuery = '';
        let isListEditMode = false;

        let localFilterLocation = 'all';
        let localFilterPriority = 'all';
        let localFilterCategory = 'all';
        let localFilterSchedule = 'all';

        let isTaskModalOpen = false;
        let editingTask = null;
        let pendingAiTask = null;
        let customModal = { isOpen: false, type: '', data: null };
        let isSelectCategoryModalOpen = false;
        let viewingImage = null;
        
        let categoryFormState = { name: '', color: 'bg-blue-500', icon: 'list' };
        let tempMemo = '';
        let taskFormSubtasks = [];
        let taskFormAttachments = [];
        let defaultCategory = '';
        let defaultSchedule = '';
        let taskFormDraft = null;

        const appContainer = document.getElementById('app');

        function saveTasksToLocal() { safeStorage.setItem('smart_tasks', JSON.stringify(tasks)); }
        function saveCategoriesToLocal() { safeStorage.setItem('smart_categories', JSON.stringify(categories)); }

        function saveTaskToDB(task) {
            saveTasksToLocal();
            if (currentUser) {
                try { setDoc(doc(db, 'users', currentUser.uid, 'tasks', task.id), task); } catch(e) { console.error(e); }
            }
        }
        function deleteTaskFromDB(taskId) {
            saveTasksToLocal();
            if (currentUser) {
                try { deleteDoc(doc(db, 'users', currentUser.uid, 'tasks', taskId)); } catch(e) { console.error(e); }
            }
        }
        function saveCategoryToDB(cat) {
            saveCategoriesToLocal();
            if (currentUser) {
                try { setDoc(doc(db, 'users', currentUser.uid, 'categories', cat.id), cat); } catch(e) { console.error(e); }
            }
        }
        function deleteCategoryFromDB(catId) {
            saveCategoriesToLocal();
            if (currentUser) {
                try { deleteDoc(doc(db, 'users', currentUser.uid, 'categories', catId)); } catch(e) { console.error(e); }
            }
        }

        function generateId() { return Math.random().toString(36).substr(2, 9); }
        function formatDate(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
        function getTodayStr() { return formatDate(new Date()); }
        function getThisWeekRange() {
            const d = new Date(); const day = d.getDay(); const diffToMon = day === 0 ? -6 : 1 - day;
            const mon = new Date(d); mon.setDate(mon.getDate() + diffToMon);
            const sun = new Date(mon); sun.setDate(sun.getDate() + 6);
            return { start: formatDate(mon), end: formatDate(sun) };
        }
        function getWeekendStr() { return getThisWeekRange().end; }
        function getThisMonthPrefix() {
            const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
        }
        function getMonthEndStr() {
            const d = new Date(); const end = new Date(d.getFullYear(), d.getMonth() + 1, 0); 
            return formatDate(end);
        }

        function getInitialDueDate(schedule, detail) {
            const d = new Date();
            if (schedule === 'Daily') return formatDate(d);
            if (schedule === 'Weekly') {
                const targetDay = (detail === undefined || detail === '') ? 0 : parseInt(detail);
                let diff = targetDay - d.getDay();
                if (diff < 0) diff += 7;
                d.setDate(d.getDate() + diff);
                return formatDate(d);
            }
            if (schedule === 'Monthly') {
                const actualDetail = (detail === undefined || detail === '') ? 'last' : detail;
                let y = d.getFullYear(); let m = d.getMonth();
                if (actualDetail === 'last') return formatDate(new Date(y, m + 1, 0));
                else {
                    let tDate = parseInt(actualDetail);
                    let nextD = new Date(y, m, tDate);
                    if (nextD.getMonth() !== m) nextD = new Date(y, m + 1, 0);
                    if (nextD < d && formatDate(nextD) !== formatDate(d)) {
                        nextD = new Date(y, m + 1, tDate);
                        if (nextD.getMonth() !== m + 1) nextD = new Date(y, m + 2, 0);
                    }
                    return formatDate(nextD);
                }
            }
            return formatDate(d);
        }

        function getNextDueDate(schedule, detail, fromDateStr) {
            if (!fromDateStr) return getInitialDueDate(schedule, detail);
            const parts = fromDateStr.split('-');
            if (parts.length !== 3) return getInitialDueDate(schedule, detail);
            
            let y = parseInt(parts[0]);
            let m = parseInt(parts[1]) - 1;
            let d = parseInt(parts[2]);
            let nextDateObj = new Date(y, m, d);
            
            const today = new Date();
            today.setHours(0,0,0,0);

            if (schedule === 'Daily') {
                nextDateObj.setDate(nextDateObj.getDate() + 1);
                if (nextDateObj < today) nextDateObj = new Date(today);
            } else if (schedule === 'Weekly') {
                nextDateObj.setDate(nextDateObj.getDate() + 7);
                while (nextDateObj < today) { nextDateObj.setDate(nextDateObj.getDate() + 7); }
            } else if (schedule === 'Monthly') {
                let actualDetail = (detail === undefined || detail === '') ? 'last' : detail;
                do {
                    m++;
                    if (m > 11) { y++; m = 0; }
                    if (actualDetail === 'last') {
                        nextDateObj = new Date(y, m + 1, 0);
                    } else {
                        let tDate = parseInt(actualDetail);
                        nextDateObj = new Date(y, m, tDate);
                        if (nextDateObj.getMonth() !== m) nextDateObj = new Date(y, m + 1, 0);
                    }
                } while (nextDateObj < today);
            }
            return formatDate(nextDateObj);
        }

        function processRecurringTasks() {
            let newTasks = [];
            let updatedTasks = [];
            const todayStr = getTodayStr();
            let changed = false;

            tasks.forEach(t => {
                if (!t.completed && t.dueDate && t.dueDate < todayStr) {
                    const schedBase = t.schedule ? t.schedule.replace('_Completed', '').replace('_Expired', '') : '';
                    if (['Daily', 'Weekly', 'Monthly'].includes(schedBase) && !t.schedule.includes('_Expired')) {
                        const nextDue = getNextDueDate(schedBase, t.recurringDetail, t.dueDate);
                        
                        const newTask = { ...t, id: generateId(), dueDate: nextDue, createdAt: Date.now() };
                        t.schedule = schedBase + '_Expired';
                        
                        newTasks.push(newTask);
                        updatedTasks.push(t);
                        changed = true;
                    }
                }
            });

            if (changed) {
                newTasks.forEach(nt => tasks.push(nt));
                saveTasksToLocal();
                updatedTasks.forEach(ut => saveTaskToDB(ut));
                newTasks.forEach(nt => saveTaskToDB(nt));
            }
            return changed;
        }

        function isActiveCompletedTask(t) {
            if (!t.completed) return false;
            const schedBase = t.schedule ? t.schedule.replace('_Completed', '').replace('_Expired', '') : '';
            if (!['Daily', 'Weekly', 'Monthly'].includes(schedBase)) return false;
            
            const today = getTodayStr();
            // 期日満了前なら残す
            if (t.dueDate && t.dueDate >= today) return true;
            
            // 今日完了したものなら達成感のために今日中は残す
            if (t.completedAt) {
                const completedDateStr = formatDate(new Date(t.completedAt));
                if (completedDateStr === today) return true;
            }
            return false;
        }

        function isTodayTask(t) {
            const schedBase = t.schedule ? t.schedule.replace('_Completed', '').replace('_Expired', '') : '';
            if (schedBase === 'Today' || schedBase === 'Daily') return true;
            const today = getTodayStr();
            if (t.dueDate && t.dueDate <= today) return true;
            return false;
        }
        
        function isWeekTask(t) {
            if (isTodayTask(t)) return false;
            const today = getTodayStr();
            const { end: weekEnd } = getThisWeekRange();
            if (t.dueDate && t.dueDate > today && t.dueDate <= weekEnd) return true;
            const schedBase = t.schedule ? t.schedule.replace('_Completed', '').replace('_Expired', '') : '';
            if (!t.dueDate && (schedBase === 'Week' || schedBase === 'Weekly')) return true;
            return false;
        }
        
        function isMonthTask(t) {
            if (isTodayTask(t) || isWeekTask(t)) return false;
            const thisMonthPrefix = getThisMonthPrefix();
            // 当月以降（未来の月も）であればMonthに含める
            if (t.dueDate && t.dueDate >= thisMonthPrefix + "-01") return true;
            const schedBase = t.schedule ? t.schedule.replace('_Completed', '').replace('_Expired', '') : '';
            if (schedBase === 'Month' || schedBase === 'Monthly') return true;
            return false;
        }

        function calculateSimilarity(str1, str2) {
            if (!str1 || !str2) return 0;
            const s1 = String(str1).toLowerCase(); const s2 = String(str2).toLowerCase();
            if (s1 === s2) return 1.0;
            if (s1.length < 2 || s2.length < 2) return (s1.includes(s2) || s2.includes(s1)) ? 0.5 : 0;
            let matchCount = 0; const total = s1.length - 1;
            for (let i = 0; i < s1.length - 1; i++) {
                const bigram = s1.substring(i, i + 2);
                if (s2.includes(bigram)) matchCount++;
            }
            return matchCount / total;
        }

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str).replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        function getCounts() {
            const activeTasks = tasks.filter(t => !t.completed);
            return {
                Today: activeTasks.filter(t => isTodayTask(t)).length,
                Week: activeTasks.filter(t => isWeekTask(t)).length,
                Month: activeTasks.filter(t => isMonthTask(t)).length,
                Daily: tasks.filter(t => t.schedule && t.schedule.startsWith('Daily') && (!t.completed || isActiveCompletedTask(t))).length,
                Weekly: tasks.filter(t => t.schedule && t.schedule.startsWith('Weekly') && (!t.completed || isActiveCompletedTask(t))).length,
                Monthly: tasks.filter(t => t.schedule && t.schedule.startsWith('Monthly') && (!t.completed || isActiveCompletedTask(t))).length,
                Undated: activeTasks.filter(t => !t.schedule || t.schedule === '').length,
                Executed: tasks.filter(t => t.completed && !isActiveCompletedTask(t)).length // 完全に終わったものだけカウント
            };
        }

        window.insertTaskAtProperPosition = (task) => {
            tasks = tasks.filter(t => t.id !== task.id);
            if (task.completed) {
                const firstCompletedIndex = tasks.findIndex(t => t.completed);
                if (firstCompletedIndex === -1) tasks.push(task);
                else tasks.splice(firstCompletedIndex, 0, task);
            } else {
                const priorityWeight = { high: 3, medium: 2, low: 1, none: 0 };
                const taskWeight = priorityWeight[task.priority || 'none'] || 0;
                
                let inserted = false;
                for (let i = 0; i < tasks.length; i++) {
                    if (tasks[i].completed) {
                        tasks.splice(i, 0, task); inserted = true; break;
                    }
                    const w = priorityWeight[tasks[i].priority || 'none'] || 0;
                    if (taskWeight > w) {
                        tasks.splice(i, 0, task); inserted = true; break;
                    }
                }
                if (!inserted) tasks.push(task);
            }
        };

        async function aiCategorizeAndIcon(text) {
            if (tasks.length > 0) {
                let bestMatch = null; let highestScore = 0.4;
                for (let i = tasks.length - 1; i >= 0; i--) {
                    const t = tasks[i];
                    if (!t.category) continue;
                    const score = calculateSimilarity(text, t.title);
                    if (score > highestScore) { highestScore = score; bestMatch = t; }
                }
                if (bestMatch) {
                    const targetCat = categories.find(c => c.name === bestMatch.category);
                    if (targetCat) return { category: targetCat.name, icon: targetCat.icon, isLearned: true };
                }
            }
            let catName = categories.length > 0 ? categories[0].name : '未分類';
            let icon = categories.length > 0 ? categories[0].icon : 'list';
            if (text.match(/(する|行く|確認|提出|連絡|電話|メール|作成|予約|調べる|読む|書く|払う|掃除)/)) {
                const target = categories.find(c => c.name.toLowerCase().includes('todo') || c.name.toLowerCase().includes('仕事') || c.name.toLowerCase().includes('work'));
                if (target) { catName = target.name; icon = target.icon; }
            } else if (text.match(/(買う|購入|スーパー|コンビニ|注文|肉|野菜|牛乳|卵|パン|洗剤|薬|水)/)) {
                const target = categories.find(c => c.name.toLowerCase().includes('買') || c.name.toLowerCase().includes('shopping'));
                if (target) { catName = target.name; icon = target.icon; }
            } else if (text.match(/(動画|youtube|見る|映画|アニメ)/i)) {
                const target = categories.find(c => c.name.toLowerCase().includes('youtube') || c.name.toLowerCase().includes('動画'));
                if (target) { catName = target.name; icon = target.icon; }
            }
            return { category: catName, icon: icon };
        }

        function render() {
            try {
                const root = document.getElementById('bodyRoot');
                if (isDarkMode) { root.classList.add('dark', 'bg-gray-950'); root.classList.remove('bg-gray-100'); }
                else { root.classList.remove('dark', 'bg-gray-950'); root.classList.add('bg-gray-100'); }

                const showSidebarOnMobile = currentView === 'home';
                let mainTitle = 'タスク一覧';
                if (currentView === 'settings') mainTitle = '設定';
                else if (selectedCategory) mainTitle = selectedCategory;
                else if (selectedFilter) mainTitle = selectedFilter;

                const baseTasks = tasks.filter(t => {
                    if (selectedFilter === 'Executed' && !selectedCategory) {
                        return t.completed && !isActiveCompletedTask(t);
                    }
                    if (selectedCategory) {
                        if (t.category !== selectedCategory) return false;
                        if (t.completed && !isActiveCompletedTask(t)) return false;
                        return true;
                    }
                    if (t.completed) {
                        // Daily, Weekly, Monthly フィルターの場合のみ期限満了まで完了済みを表示
                        if (['Daily', 'Weekly', 'Monthly'].includes(selectedFilter)) {
                            return isActiveCompletedTask(t);
                        }
                        // Today, Week, Month, Undated では完了タスクを表示しない
                        return false;
                    }
                    
                    if (selectedFilter) {
                        if (selectedFilter === 'Today') return isTodayTask(t);
                        if (selectedFilter === 'Week') return isWeekTask(t);
                        if (selectedFilter === 'Month') return isMonthTask(t);
                        
                        const schedBase = t.schedule ? t.schedule.replace('_Completed', '').replace('_Expired', '') : '';
                        if (selectedFilter === 'Daily') return schedBase === 'Daily';
                        if (selectedFilter === 'Weekly') return schedBase === 'Weekly';
                        if (selectedFilter === 'Monthly') return schedBase === 'Monthly';
                        if (selectedFilter === 'Undated') return !t.schedule || t.schedule === '';
                        return false;
                    }
                    return true;
                });

                const availLocs = new Set(baseTasks.map(t => t.location && t.location !== 'none' ? t.location : 'none'));
                const availPris = new Set(baseTasks.map(t => t.priority && t.priority !== 'none' ? t.priority : 'none'));
                const availCats = new Set(baseTasks.map(t => t.category || ''));
                const availScheds = new Set();
                baseTasks.forEach(t => {
                    const schedBase = t.schedule ? t.schedule.replace('_Completed', '').replace('_Expired', '') : '';
                    if (!t.completed) {
                        if (isTodayTask(t)) availScheds.add('Today');
                        if (isWeekTask(t)) availScheds.add('Week');
                        if (isMonthTask(t)) availScheds.add('Month');
                        if (!t.schedule || t.schedule === '') availScheds.add('Undated');
                    }
                    if (schedBase === 'Daily') availScheds.add('Daily');
                    if (schedBase === 'Weekly') availScheds.add('Weekly');
                    if (schedBase === 'Monthly') availScheds.add('Monthly');
                });
                
                const hasLocations = availLocs.has('home') || availLocs.has('work') || availLocs.has('outing');

                let html = `
                    <div class="flex h-screen w-full mx-auto max-w-7xl overflow-hidden bg-gray-50 dark:bg-gray-900 transition-colors duration-300 relative">
                        
                        <!-- Left Sidebar (ホーム画面) -->
                        <aside class="w-full sm:w-[320px] md:w-[380px] flex-shrink-0 flex flex-col h-full border-r border-gray-200 dark:border-gray-800 transition-transform overflow-hidden ${showSidebarOnMobile ? 'flex' : 'hidden sm:flex'}">
                            <header class="px-5 py-4 flex items-center justify-between border-b border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 z-20 flex-shrink-0">
                                <h1 class="text-xl font-bold tracking-tight text-gray-900 dark:text-white">LogLoom</h1>
                                <div class="flex items-center gap-1">
                                    <button onclick="window.toggleDarkMode()" class="p-2 rounded-full text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-800 transition">
                                        <i data-lucide="${isDarkMode ? 'sun' : 'moon'}" class="w-5 h-5"></i>
                                    </button>
                                    <button onclick="window.openSettings()" class="p-2 rounded-full text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-800 transition">
                                        <i data-lucide="settings" class="w-5 h-5"></i>
                                    </button>
                                </div>
                            </header>
                            <div class="flex-1 overflow-y-auto p-4 space-y-6 pb-48">
                                ${renderHomeContent()}
                            </div>
                        </aside>

                        <!-- Right Main Area -->
                        <main class="flex-1 min-w-0 flex flex-col h-full relative overflow-hidden ${!showSidebarOnMobile ? 'flex' : 'hidden sm:flex'}">
                            <header class="px-5 py-4 flex items-center justify-between border-b border-gray-200 dark:border-gray-800 bg-white/80 dark:bg-gray-900/80 backdrop-blur z-20 flex-shrink-0">
                                <div class="flex items-center gap-2 overflow-hidden">
                                    <button onclick="window.navigate('home')" class="sm:hidden p-1.5 -ml-2 rounded-full text-blue-500 hover:bg-blue-50 dark:hover:bg-gray-800 transition flex items-center flex-shrink-0">
                                    <i data-lucide="chevron-left" class="w-6 h-6"></i>
                                    <span class="font-semibold text-base">戻る</span>
                                </button>
                                    <h2 class="text-2xl font-bold tracking-tight text-gray-900 dark:text-white truncate ${currentView !== 'home' ? '' : 'hidden sm:block'}">${escapeHtml(mainTitle)}</h2>
                                </div>

        window.initSortable = () => {
            const listEl = document.getElementById('categoryListContainer');
            if (listEl && typeof Sortable !== 'undefined') {
                if (window.sortableCategory) window.sortableCategory.destroy();
                window.sortableCategory = new Sortable(listEl, {
                    animation: 150, delay: 300, delayOnTouchOnly: true, fallbackTolerance: 5, filter: 'button, input, a, .prevent-drag',
                    onEnd: (evt) => {
                        const item = categories.splice(evt.oldIndex, 1)[0];
                        categories.splice(evt.newIndex, 0, item);
                        categories.forEach(c => saveCategoryToDB(c));
                    }
                });
            }
            const taskEl = document.getElementById('taskListContainer');
            if (taskEl && typeof Sortable !== 'undefined') {
                if (window.sortableTask) window.sortableTask.destroy();
                window.sortableTask = new Sortable(taskEl, {
                    animation: 150, delay: 300, delayOnTouchOnly: true, fallbackTolerance: 5, filter: 'button, input, a, textarea, .prevent-drag',
                    onEnd: (evt) => {
                        const taskNodes = Array.from(taskEl.children);
                        const newOrderIds = taskNodes.map(node => node.dataset.taskId).filter(id => id);
                        const movedTasks = newOrderIds.map(id => tasks.find(t => t.id === id)).filter(Boolean);
                        tasks = tasks.filter(t => !newOrderIds.includes(t.id));
                        tasks = [...movedTasks, ...tasks]; 
                        tasks.forEach(t => saveTaskToDB(t));
                    }
                });
            }
        };

                <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm overflow-hidden mb-8 flex flex-col">

        function renderTaskList() {
            const todayStr = getTodayStr();
            let filteredTasks = tasks.filter(t => {
                if (selectedFilter === 'Executed' && !selectedCategory) {
                    if (t.completed && !isActiveCompletedTask(t)) return true;
                    return false;
                }

                if (selectedCategory) {
                    if (t.category !== selectedCategory) return false;
                    if (t.completed && !isActiveCompletedTask(t)) return false; 
                }

                if (!selectedCategory && selectedFilter && selectedFilter !== 'Executed') {
                    if (t.completed) {
                        // Daily, Weekly, Monthly フィルターの場合のみ期限満了まで完了済みを表示
                        if (['Daily', 'Weekly', 'Monthly'].includes(selectedFilter)) {
                            if (!isActiveCompletedTask(t)) return false;
                        } else {
                            // Today, Week, Month, Undated では完了タスクを表示しない
                            return false;
                        }
                    }

                    let matchFilter = false;
                    if (selectedFilter === 'Today') matchFilter = isTodayTask(t);
                    else if (selectedFilter === 'Week') matchFilter = isWeekTask(t);
                    else if (selectedFilter === 'Month') matchFilter = isMonthTask(t);
                    else {
                        const schedBase = t.schedule ? t.schedule.replace('_Completed', '').replace('_Expired', '') : '';
                        if (selectedFilter === 'Daily') matchFilter = schedBase === 'Daily';
                        else if (selectedFilter === 'Weekly') matchFilter = schedBase === 'Weekly';
                        else if (selectedFilter === 'Monthly') matchFilter = schedBase === 'Monthly';
                        else if (selectedFilter === 'Undated') matchFilter = !t.schedule || t.schedule === '';
                    }
                    if (!matchFilter) return false;
                }

                if (localFilterLocation !== 'all' && t.location !== localFilterLocation) return false;
                if (localFilterPriority !== 'all' && t.priority !== localFilterPriority) return false;
                if (localFilterCategory !== 'all' && t.category !== localFilterCategory) return false;
                if (localFilterSchedule !== 'all') {
                    // ローカルフィルターで Today, Week, Month, Undated が選ばれた場合も完了済みは除外
                    if (t.completed && ['Today', 'Week', 'Month', 'Undated'].includes(localFilterSchedule)) {
                        return false;
                    }
                    let matchLocalSchedule = false;
                    const schedBase = t.schedule ? t.schedule.replace('_Completed', '').replace('_Expired', '') : '';
                    if (localFilterSchedule === 'Today') matchLocalSchedule = isTodayTask(t);
                    else if (localFilterSchedule === 'Week') matchLocalSchedule = isWeekTask(t);
                    else if (localFilterSchedule === 'Month') matchLocalSchedule = isMonthTask(t);
                    else if (localFilterSchedule === 'Daily') matchLocalSchedule = schedBase === 'Daily';
                    else if (localFilterSchedule === 'Weekly') matchLocalSchedule = schedBase === 'Weekly';
                    else if (localFilterSchedule === 'Monthly') matchLocalSchedule = schedBase === 'Monthly';
                    else if (localFilterSchedule === 'Undated') matchLocalSchedule = (!t.schedule || t.schedule === '');
                    
                    if (!matchLocalSchedule) return false;
                }

                return true;
            });

            if (searchQuery) {
                filteredTasks = filteredTasks.filter(t => t.title.toLowerCase().includes(searchQuery.toLowerCase()));
            }

            const activeFiltered = filteredTasks.filter(t => !t.completed);
            const completedFiltered = filteredTasks.filter(t => t.completed);
            filteredTasks = [...activeFiltered, ...completedFiltered];

            return `
                <div class="space-y-3" id="taskListContainer">
                    ${filteredTasks.length === 0 ? `
                        <div class="flex flex-col items-center justify-center py-32 text-gray-400 h-full w-full">
                            <i data-lucide="check-circle" class="w-16 h-16 mb-4 opacity-30"></i>
                            <p class="text-lg font-medium text-gray-500">タスクはありません</p>
                        </div>
                    ` : filteredTasks.map(task => {
                        const isCompleted = task.completed;
                        const schedBase = (task.schedule || '').replace('_Completed', '').replace('_Expired', '');
                        let displaySchedule = escapeHtml(schedBase);
                        
                        if (schedBase === 'Weekly') {
                            if (task.recurringDetail !== undefined && task.recurringDetail !== '') {
                                const days = ['日', '月', '火', '水', '木', '金', '土'];
                                displaySchedule = `毎週${days[parseInt(task.recurringDetail)]}曜`;
                            }
                        } else if (schedBase === 'Monthly') {
                            if (task.recurringDetail !== undefined && task.recurringDetail !== '') {
                                displaySchedule = task.recurringDetail === 'last' ? '毎月末' : `毎月${task.recurringDetail}日`;
                            }
                        }

                        const taskCardClass = isCompleted 
                            ? "bg-gray-50/50 dark:bg-gray-800/50 p-4 sm:p-5 rounded-2xl border border-gray-200 dark:border-gray-700 flex items-start justify-between gap-4 transition group opacity-70 hover:opacity-100 cursor-grab active:cursor-grabbing select-none"
                            : "bg-white dark:bg-gray-800 p-4 sm:p-5 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 flex items-start justify-between gap-4 transition hover:shadow-md group cursor-grab active:cursor-grabbing select-none";

                        return `
                        <div class="${taskCardClass}" data-task-id="${task.id}">
                            <div class="flex items-start gap-3 flex-1 min-w-0">
                                <input type="checkbox" ${isCompleted ? 'checked' : ''} onchange="window.toggleTaskComplete('${task.id}')" class="mt-1 w-6 h-6 rounded-full border-gray-300 text-blue-600 focus:ring-blue-500 cursor-pointer flex-shrink-0 transition-colors">
                                <div class="flex-1 min-w-0">
                                    <p class="font-medium text-base text-gray-800 dark:text-gray-100 break-words ${isCompleted ? 'line-through text-gray-400 dark:text-gray-500' : ''}">${escapeHtml(task.title)}</p>
                                    
                                    ${task.url ? `<a href="${escapeHtml(task.url)}" target="_blank" class="text-blue-500 hover:underline text-sm flex items-center mt-1 prevent-drag" onclick="event.stopPropagation()"><i data-lucide="link" class="w-3.5 h-3.5 mr-1"></i>リンクを開く</a>` : ''}
                                    
                                    ${task.memo ? `
                                        <div class="mt-2 text-sm text-gray-600 dark:text-gray-300 bg-gray-50 dark:bg-gray-900/50 p-3 rounded-xl border border-gray-100 dark:border-gray-700">
                                            ${task.memo.length > 50 || task.memo.includes('\n') ? `
                                                <div id="memo-${task.id}" class="line-clamp-2 cursor-pointer prevent-drag" onclick="this.classList.toggle('line-clamp-2')">
                                                    ${escapeHtml(task.memo).replace(/\n/g, '<br>')}
                                                </div>
                                                <div class="text-xs text-blue-500 cursor-pointer mt-1 font-semibold prevent-drag" onclick="document.getElementById('memo-${task.id}').classList.toggle('line-clamp-2')">続きを読む / 閉じる</div>
                                            ` : `<div>${escapeHtml(task.memo).replace(/\n/g, '<br>')}</div>`}
                                        </div>
                                    ` : ''}

                                    ${task.subtasks && task.subtasks.length > 0 ? `
                                        <div class="mt-3 space-y-2 border-t border-gray-100 dark:border-gray-700 pt-3">
                                            ${task.subtasks.map((st, i) => `
                                                <div class="flex items-center gap-2">
                                                    <input type="checkbox" ${st.completed ? 'checked' : ''} onchange="window.toggleListSubtask('${task.id}', ${i})" class="w-4 h-4 rounded text-blue-500 focus:ring-blue-500 cursor-pointer">
                                                    <span class="text-sm break-words ${st.completed ? 'line-through text-gray-400' : 'text-gray-700 dark:text-gray-200'}">${escapeHtml(st.title)}</span>
                                                </div>
                                            `).join('')}
                                        </div>
                                    ` : ''}

                                    ${task.attachments && task.attachments.length > 0 ? `
                                        <div class="flex flex-wrap gap-2 mt-3">
                                            ${task.attachments.map(att => `
                                                ${att.type.startsWith('image/') ? `
                                                    <div onclick="window.openImageViewer('${att.data}')" class="block w-16 h-16 rounded-lg overflow-hidden border border-gray-200 hover:opacity-80 transition cursor-zoom-in prevent-drag">
                                                        <img src="${att.data}" class="w-full h-full object-cover">
                                                    </div>
                                                ` : `
                                                    <a href="${att.data}" download="${att.name}" class="flex items-center gap-1 bg-gray-100 dark:bg-gray-700 px-2 py-1.5 rounded-lg text-xs font-semibold text-gray-600 hover:bg-gray-200 transition border border-gray-200 dark:border-gray-600 prevent-drag" onclick="event.stopPropagation()">
                                                        <i data-lucide="file-text" class="w-4 h-4"></i> ${escapeHtml(att.name)}
                                                    </a>
                                                `}
                                            `).join('')}
                                        </div>
                                    ` : ''}

                                    <div class="flex flex-wrap items-center gap-2 mt-3 text-xs text-gray-500">
                                        ${task.category ? `<span class="bg-gray-100 dark:bg-gray-700/50 px-2.5 py-1 rounded-md font-medium text-gray-600 dark:text-gray-300">${escapeHtml(task.category)}</span>` : ''}
                                        ${displaySchedule ? `<span class="bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 px-2.5 py-1 rounded-md font-medium">${displaySchedule}</span>` : ''}
                                        ${task.dueDate ? `<span class="${!isCompleted && task.dueDate < todayStr ? 'bg-red-100 dark:bg-red-900/40 text-red-600 dark:text-red-400 border border-red-200 dark:border-red-800' : 'bg-purple-50 dark:bg-purple-900/30 text-purple-600 dark:text-purple-400'} px-2.5 py-1 rounded-md font-semibold flex items-center"><i data-lucide="${!isCompleted && task.dueDate < todayStr ? 'alert-circle' : 'clock'}" class="w-3.5 h-3.5 mr-1"></i>${escapeHtml(task.dueDate)}${!isCompleted && task.dueDate < todayStr ? ' (期限切れ)' : ''}</span>` : ''}
                                        ${!isCompleted && task.priority && task.priority !== 'none' ? `<span class="px-2.5 py-1 rounded-md font-bold ${task.priority === 'high' ? 'bg-red-100 text-red-600 dark:bg-red-900/30 dark:text-red-400' : task.priority === 'medium' ? 'bg-amber-100 text-amber-600 dark:bg-amber-900/30 dark:text-amber-400' : 'bg-blue-100 text-blue-600 dark:bg-blue-900/30 dark:text-blue-400'}">${escapeHtml(task.priority).toUpperCase()}</span>` : ''}
                                        ${task.location && task.location !== 'none' ? `<span class="bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 px-2.5 py-1 rounded-md font-semibold flex items-center"><i data-lucide="map-pin" class="w-3.5 h-3.5 mr-1"></i>${task.location === 'home' ? '自宅' : task.location === 'work' ? '職場' : '外出先'}</span>` : ''}
                                        ${isCompleted && task.completedAt ? `<span class="bg-green-50 dark:bg-green-900/30 text-green-600 dark:text-green-400 px-2.5 py-1 rounded-md font-semibold flex items-center"><i data-lucide="check" class="w-3.5 h-3.5 mr-1"></i>${new Date(task.completedAt).toLocaleString('ja-JP', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' })} 完了</span>` : ''}
                                    </div>
                                </div>
                            </div>
                            <div class="flex flex-col items-center gap-2 opacity-100 sm:opacity-0 group-hover:opacity-100 transition-opacity flex-shrink-0">
                                <button onclick="window.editTask('${task.id}')" class="p-2 text-gray-400 hover:text-blue-500 hover:bg-blue-50 dark:hover:bg-gray-700 rounded-full transition"><i data-lucide="edit-3" class="w-4.5 h-4.5"></i></button>
                                <button onclick="window.openCustomModal('deleteTask', { id: '${task.id}' })" class="p-2 text-gray-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-gray-700 rounded-full transition"><i data-lucide="trash-2" class="w-4.5 h-4.5"></i></button>
                            </div>
                        </div>
                        `;
                    }).join('')}
                    <div class="h-36 w-full flex-shrink-0 pointer-events-none"></div>
                </div>
            `;
        }

        function renderSettings() {
            return `
                <div class="max-w-2xl w-full mx-auto space-y-6">

                            <div class="flex items-center gap-3 mb-4">

                                <div>
                                    <p class="font-bold text-gray-900 dark:text-white">${currentUser.displayName || 'Google ユーザー'}</p>

                            </div>
                            <button onclick="window.logout()" class="w-full bg-gray-100 hover:bg-gray-200 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-800 dark:text-gray-200 font-bold py-3 px-4 rounded-xl transition">ログアウト</button>

                                <svg class="w-5 h-5 bg-white rounded-full p-0.5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                                Googleでログイン
                            </button>
                        `}
                    </div>
                    <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800 space-y-6">
                        <h3 class="font-bold text-lg border-b border-gray-100 dark:border-gray-700 pb-3 text-gray-900 dark:text-white">データ管理</h3>
                        <div class="pt-2 border-t border-gray-100 dark:border-gray-700">
                            <button onclick="if(confirm('全てのデータを消去して初期状態に戻しますか？')) { localStorage.clear(); location.reload(); }" class="text-sm text-red-500 font-semibold hover:underline">データを完全にリセット</button>
                        </div>
                    </div>
                </div>
            `;
